<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 干洗服务</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc',
                        info: '#3b82f6',
                        purple: '#8b5cf6',
                        pink: '#ec4899',
                        teal: '#14b8a6',
                        orange: '#f97316'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(to right, #1e40af, #3b82f6);
            }
            .bg-gradient {
                background-image: linear-gradient(to right, #1e40af, #3b82f6);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-6">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gradient">干洗服务</h1>
                <p class="text-gray-600 mt-2">注册新账户</p>
            </div>
            
            <form id="register-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-phone"></i>
                        </span>
                        <input type="tel" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入手机号">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
                    <div class="flex space-x-3">
                        <div class="flex-1 relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-shield"></i>
                            </span>
                            <input type="text" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入验证码">
                        </div>
                        <button type="button" class="w-32 bg-gray-100 text-gray-800 py-3 rounded-lg font-medium hover:bg-gray-200 transition-colors" id="send-code">
                            发送验证码
                        </button>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请设置密码">
                        <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500" id="toggle-password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">密码长度至少6位，包含字母和数字</p>
                </div>
                
                <div class="mb-6">
                    <div class="flex items-start">
                        <input type="checkbox" class="mt-1 mr-2" id="agree">
                        <label for="agree" class="text-sm text-gray-600">
                            我已阅读并同意 <a href="#" class="text-primary hover:underline">用户协议</a> 和 <a href="#" class="text-primary hover:underline">隐私政策</a>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors">
                    注册
                </button>
                
                <div class="mt-4 text-center">
                    <span class="text-gray-600">已有账户？</span>
                    <a href="c-login.html" class="text-primary hover:underline ml-1">立即登录</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/auth';
        
        // 检查是否已登录
        if (localStorage.getItem('userToken')) {
            window.location.href = 'c-index.html';
        }

        // 切换密码可见性
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = this.previousElementSibling;
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // 发送验证码
        let countdownTimer = null;
        document.getElementById('send-code').addEventListener('click', async function() {
            const phoneInput = document.querySelector('input[type="tel"]');
            const phone = phoneInput.value.trim();
            
            if (!phone) {
                showToast('请输入手机号', 'error');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号', 'error');
                return;
            }
            
            this.disabled = true;
            let countdown = 60;
            this.textContent = `${countdown}s后重发`;
            
            countdownTimer = setInterval(() => {
                countdown--;
                this.textContent = `${countdown}s后重发`;
                
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    this.disabled = false;
                    this.textContent = '发送验证码';
                }
            }, 1000);
            
            try {
                const response = await fetch(`${API_BASE}/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, type: 'register' })
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('验证码已发送');
                    // 开发模式下显示验证码
                    if (result.data && result.data.code) {
                        document.querySelector('input[type="text"]').value = result.data.code;
                        showToast(`测试验证码: ${result.data.code}`, 'info');
                    }
                } else {
                    showToast(result.error || '发送失败', 'error');
                    clearInterval(countdownTimer);
                    this.disabled = false;
                    this.textContent = '发送验证码';
                }
            } catch (error) {
                console.error('发送验证码错误:', error);
                showToast('网络错误', 'error');
                clearInterval(countdownTimer);
                this.disabled = false;
                this.textContent = '发送验证码';
            }
        });
        
        // 注册表单提交
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = this.querySelector('input[type="tel"]').value.trim();
            const code = this.querySelector('input[type="text"]').value.trim();
            const password = this.querySelector('input[type="password"]').value;
            const agree = document.getElementById('agree').checked;
            
            if (!phone || !code || !password) {
                showToast('请填写完整的注册信息', 'error');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号', 'error');
                return;
            }
            
            if (password.length < 6) {
                showToast('密码长度至少6位', 'error');
                return;
            }
            
            if (!agree) {
                showToast('请阅读并同意用户协议和隐私政策', 'error');
                return;
            }
            
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>注册中...';
            
            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, code })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('注册成功！');
                    setTimeout(() => window.location.href = 'c-login.html', 1000);
                } else {
                    showToast(result.error || '注册失败', 'error');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showToast('网络错误，请检查后端服务', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '注册';
            }
        });

        // Toast提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'
            } text-white font-medium`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
