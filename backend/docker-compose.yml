version: '3.8'

services:
  # MongoDB 数据库
  mongodb:
    image: mongo:latest
    container_name: dry-cleaning-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dry_cleaning

  # MySQL 数据库（可选，如果使用MySQL）
  mysql:
    image: mysql:8.0
    container_name: dry-cleaning-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: dry_cleaning_root
      MYSQL_DATABASE: dry_cleaning
      MYSQL_USER: dry_cleaning
      MYSQL_PASSWORD: dry_cleaning123

volumes:
  mongo-data:
  mysql-data:
