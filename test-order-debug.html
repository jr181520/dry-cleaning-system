<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单同步诊断工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🔍 订单同步诊断工具</h1>
            <p class="text-gray-600">检查为什么订单没有在各个系统中显示</p>
        </div>

        <!-- 诊断结果 -->
        <div id="diagnosticResults" class="space-y-6">
            <!-- 诊断项目将通过JavaScript动态生成 -->
        </div>

        <!-- 操作区 -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="runAllDiagnostics()" 
                class="bg-blue-600 text-white py-4 px-6 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">
                🔄 重新诊断
            </button>
            <button onclick="setupTestEnvironment()" 
                class="bg-green-600 text-white py-4 px-6 rounded-xl font-bold hover:bg-green-700 transition shadow-lg">
                🚀 一键修复（设置测试环境）
            </button>
        </div>

        <!-- 快速链接 -->
        <div class="mt-8 bg-white rounded-xl p-6 shadow">
            <h3 class="font-bold text-lg mb-4">📱 快速访问各系统</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <a href="test-login-setup.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200 transition font-medium">
                    ⚙️ 测试环境设置
                </a>
                <a href="test-order-sync.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-orange-100 text-orange-700 rounded-lg hover:bg-orange-200 transition font-medium">
                    📦 订单同步测试
                </a>
                <a href="c-orders.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition font-medium">
                    📱 C端订单
                </a>
                <a href="m-index.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition font-medium">
                    🏪 门店端
                </a>
                <a href="admin.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition font-medium">
                    💼 管理后台
                </a>
                <a href="c-login.html" target="_blank" 
                    class="block text-center py-3 px-4 bg-pink-100 text-pink-700 rounded-lg hover:bg-pink-200 transition font-medium">
                    🔐 C端登录页
                </a>
            </div>
        </div>
    </div>

    <script>
        // 诊断项目定义
        const diagnosticItems = [
            {
                id: 'c-user-token',
                title: 'C端用户登录状态',
                description: '检查C端小程序是否有有效的登录令牌',
                check: () => {
                    const token = localStorage.getItem('userToken');
                    if (!token) {
                        return { status: 'error', message: '❌ 未登录', detail: 'localStorage中没有userToken，需要先登录C端或使用测试环境设置' };
                    }
                    try {
                        const user = JSON.parse(token);
                        return { status: 'success', message: '✅ 已登录', detail: `用户：${user.name || '未知'} (${user.phone || '未知'})` };
                    } catch (e) {
                        return { status: 'error', message: '❌ 令牌格式错误', detail: 'userToken存在但无法解析为JSON' };
                    }
                }
            },
            {
                id: 'c-orders',
                title: 'C端订单数据',
                description: '检查localStorage中的orders数据',
                check: () => {
                    const orders = localStorage.getItem('orders');
                    if (!orders) {
                        return { status: 'warning', message: '⚠️ 无订单数据', detail: 'localStorage中没有orders数据，请先创建测试订单' };
                    }
                    try {
                        const ordersList = JSON.parse(orders);
                        if (!Array.isArray(ordersList)) {
                            return { status: 'error', message: '❌ 数据格式错误', detail: 'orders不是数组格式' };
                        }
                        if (ordersList.length === 0) {
                            return { status: 'warning', message: '⚠️ 订单为空', detail: 'orders数组为空，请使用"订单同步测试"工具创建测试订单' };
                        }
                        return { status: 'success', message: `✅ ${ordersList.length} 条订单`, detail: `订单号示例：${ordersList[0]?.orderId || '无'}` };
                    } catch (e) {
                        return { status: 'error', message: '❌ 数据解析失败', detail: e.message };
                    }
                }
            },
            {
                id: 'm-store-token',
                title: '门店端登录状态',
                description: '检查门店端管理系统是否有有效的登录令牌',
                check: () => {
                    const token = localStorage.getItem('storeToken');
                    if (!token) {
                        return { status: 'error', message: '❌ 未登录', detail: 'localStorage中没有storeToken，需要先登录门店端' };
                    }
                    try {
                        const store = JSON.parse(token);
                        return { status: 'success', message: '✅ 已登录', detail: `门店：${store.storeName || '未知'} (ID: ${store.storeId || '未知'})` };
                    } catch (e) {
                        return { status: 'error', message: '❌ 令牌格式错误', detail: 'storeToken存在但无法解析' };
                    }
                }
            },
            {
                id: 'm-orders',
                title: '门店端订单数据',
                description: '检查门店端的订单数据（从后端API或localStorage）',
                check: () => {
                    const orders = localStorage.getItem('store_orders');
                    if (!orders) {
                        return { status: 'warning', message: '⚠️ 无本地缓存', detail: 'localStorage中没有store_orders，可能从未从后端加载订单数据' };
                    }
                    try {
                        const ordersList = JSON.parse(orders);
                        return { status: 'success', message: `✅ ${ordersList.length} 条订单`, detail: '这是从后端API获取的本地缓存' };
                    } catch (e) {
                        return { status: 'error', message: '❌ 数据解析失败', detail: e.message };
                    }
                }
            },
            {
                id: 'admin-token',
                title: '管理后台登录状态',
                description: '检查管理后台是否有有效的管理员令牌',
                check: () => {
                    const token = localStorage.getItem('adminToken');
                    if (!token) {
                        return { status: 'error', message: '❌ 未登录', detail: 'localStorage中没有adminToken，需要先登录管理后台' };
                    }
                    return { status: 'success', message: '✅ 已登录', detail: '管理后台已登录' };
                }
            },
            {
                id: 'backend-api',
                title: '后端API连接',
                description: '检查后端服务是否运行',
                check: async () => {
                    try {
                        const response = await fetch('http://localhost:3000/api/admin/dashboard', {
                            method: 'GET',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        if (response.ok) {
                            return { status: 'success', message: '✅ 后端运行中', detail: 'http://localhost:3000 可以访问' };
                        } else {
                            return { status: 'warning', message: '⚠️ 后端响应异常', detail: `HTTP ${response.status}` };
                        }
                    } catch (e) {
                        return { status: 'error', message: '❌ 后端未运行', detail: '无法连接到 http://localhost:3000，请确保后端服务已启动' };
                    }
                }
            }
        ];

        // 执行单个诊断
        async function runDiagnostic(item) {
            const result = await item.check();
            return { ...item, result };
        }

        // 执行所有诊断
        async function runAllDiagnostics() {
            const container = document.getElementById('diagnosticResults');
            container.innerHTML = '<div class="text-center py-8"><div class="text-gray-500">🔄 正在诊断...</div></div>';
            
            const results = await Promise.all(diagnosticItems.map(runDiagnostic));
            
            container.innerHTML = results.map(item => {
                const { id, title, description, result } = item;
                const statusColors = {
                    success: 'bg-green-50 border-green-200 text-green-800',
                    warning: 'bg-yellow-50 border-yellow-200 text-yellow-800',
                    error: 'bg-red-50 border-red-200 text-red-800'
                };
                const borderColors = {
                    success: 'border-l-4 border-l-green-500',
                    warning: 'border-l-4 border-l-yellow-500',
                    error: 'border-l-4 border-l-red-500'
                };
                
                return `
                    <div class="bg-white rounded-xl p-6 shadow ${borderColors[result.status]}">
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="font-bold text-lg ${statusColors[result.status].split(' ')[2]}">${title}</h3>
                            <span class="px-3 py-1 rounded-full text-sm font-medium ${statusColors[result.status]}">${result.message}</span>
                        </div>
                        <p class="text-gray-600 text-sm mb-3">${description}</p>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <code class="text-sm text-gray-700">${result.detail}</code>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 一键修复
        function setupTestEnvironment() {
            // 跳转到测试环境设置页面
            window.location.href = 'test-login-setup.html';
        }

        // 页面加载时自动诊断
        document.addEventListener('DOMContentLoaded', runAllDiagnostics);
    </script>
</body>
</html>
