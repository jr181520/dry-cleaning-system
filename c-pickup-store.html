<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>到店自提 - 干洗服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .item-card {
            background: #ffffff;
            border-radius: 16rpx;
            padding: 20rpx;
            margin-bottom: 16rpx;
            box-shadow: 0 2rpx 8rpx rgba(0,0,0,0.04);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4rpx 12rpx;
            border-radius: 8rpx;
            font-size: 22rpx;
        }
        .lamp-indicator {
            width: 120rpx;
            height: 120rpx;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48rpx;
            transition: all 0.5s ease;
        }
        .lamp-off {
            background: #e5e7eb;
            color: #9ca3af;
            box-shadow: inset 0 2rpx 8rpx rgba(0,0,0,0.1);
        }
        .lamp-on {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #fff;
            box-shadow: 0 0 40rpx rgba(251, 191, 36, 0.6), 0 4rpx 12rpx rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">
    <!-- 顶部导航 -->
    <header class="bg-white sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100">
            <a href="c-orders.html" class="text-gray-700">
                <i class="fa fa-arrow-left text-lg"></i>
            </a>
            <span class="text-lg font-semibold text-gray-800">到店自提</span>
            <span class="w-8"></span>
        </div>
    </header>

        <!-- 灯条状态 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-6 text-center shadow-sm">
        <div class="lamp-indicator lamp-off mx-auto mb-4" id="lampIndicator">
            💡
        </div>
        <h3 class="text-lg font-semibold text-gray-800 mb-2" id="lampStatus">等待取件确认</h3>
        <p class="text-sm text-gray-500" id="lampDesc">点击下方"确认取件"按钮点亮灯条</p>
        
        <!-- 灯条可视化 - 动态生成 -->
        <div class="mt-4 flex justify-center gap-2" id="lampStrip">
            <!-- 灯条将通过JavaScript动态生成 -->
        </div>
        <p class="text-xs text-gray-400 mt-2" id="lampHint">店铺灯条状态</p>
    </div>

    <!-- 物品明细 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-list text-primary"></i>
            物品明细
            <span id="itemsCount" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full ml-auto">0件</span>
        </h3>
        
        <!-- 一键点亮所有灯条按钮 -->
        <button id="lightAllBtn" onclick="lightAllItems()" 
            class="w-full mb-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
            <i class="fa fa-lightbulb-o"></i>
            <span>点亮所有灯条</span>
        </button>
        
        <div id="itemsList">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 店铺信息 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-store text-primary"></i>
            店铺信息
        </h3>
        <div id="storeInfo">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 订单信息 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-info-circle text-primary"></i>
            订单信息
        </h3>
        <div class="space-y-3 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">订单编号</span>
                <span class="text-gray-800 font-mono" id="orderNo">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">下单时间</span>
                <span class="text-gray-800" id="createTime">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">订单金额</span>
                <span class="text-red-500 font-semibold text-lg">¥<span id="totalAmount">0</span></span>
            </div>
        </div>
    </div>

    <!-- 底部确认按钮 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-lg" id="bottomAction">
        <button onclick="confirmPickup()" class="w-full py-4 bg-primary text-white rounded-xl font-semibold text-lg flex items-center justify-center gap-2" id="confirmBtn">
            <i class="fa fa-check-circle"></i>
            确认取件
        </button>
    </div>

    <script>
        let orderId = null;
        let orderData = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            orderId = urlParams.get('id');
            
            if (!orderId) {
                alert('订单ID不能为空');
                window.location.href = 'c-orders.html';
                return;
            }

            await loadOrderData();
        });

        // 加载订单数据
        async function loadOrderData() {
            // 先从localStorage查找
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orderData = orders.find(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
            
            // 如果orders中没有，尝试从store_orders查找（代客下单门店自提订单）
            if (!orderData) {
                const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
                orderData = storeOrders.find(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
                console.log('[C端门店自提] 从store_orders查找订单:', orderId, orderData ? '找到' : '未找到');
            }
            
            // 如果本地没有，尝试从API获取
            if (!orderData) {
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || ''),
                            'Cache-Control': 'no-cache'
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        orderData = result.data;
                        console.log('[C端门店自提] 从API获取订单数据:', orderData);
                    }
                } catch (error) {
                    console.warn('从API获取订单失败:', error);
                }
            }
            
            // 确保items数据完整
            if (orderData) {
                console.log('[C端门店自提] 订单物品数据:', {
                    orderId: orderData.orderId,
                    items: orderData.items,
                    services: orderData.services,
                    debugItems: orderData.debugItems
                });
                
                // 如果items为空但services有数据，使用services
                if ((!orderData.items || orderData.items.length === 0) && orderData.services) {
                    orderData.items = orderData.services;
                }
                // 如果debugItems有价格信息但items没有，合并数据
                if (orderData.debugItems && orderData.debugItems.length > 0 && orderData.items) {
                    orderData.items = orderData.items.map((item, i) => ({
                        ...item,
                        price: item.price || orderData.debugItems[i]?.price || 0
                    }));
                }
            }

            if (!orderData) {
                alert('未找到订单信息');
                window.location.href = 'c-orders.html';
                return;
            }

            renderPage();
        }

        // 渲染页面
        function renderPage() {
            // 物品列表
            const items = orderData.items || orderData.services || [];
            const itemsListEl = document.getElementById('itemsList');
            const itemsCountEl = document.getElementById('itemsCount');
            
            itemsCountEl.textContent = `${items.length}件`;
            
            // 动态生成灯条（根据物品数量）
            const lampStrip = document.getElementById('lampStrip');
            lampStrip.innerHTML = items.map((item, index) => {
                const isLightOn = item.lightStatus === 'on';
                const isCheckedOut = item.itemStatus === 'checked_out';
                return `<div class="lamp-bulb w-8 h-8 rounded-full transition-all duration-500 ${isCheckedOut ? 'bg-gray-400' : isLightOn ? 'bg-yellow-400 shadow-lg' : 'bg-gray-200'}" data-index="${index}"></div>`;
            }).join('');
            
            if (items.length === 0) {
                itemsListEl.innerHTML = '<p class="text-gray-500 text-center py-4">暂无物品信息</p>';
            } else {
                itemsListEl.innerHTML = items.map((item, index) => {
                    const isLightOn = item.lightStatus === 'on';
                    const isCheckedOut = item.itemStatus === 'checked_out';
                    
                    return `
                    <div class="item-card ${isCheckedOut ? 'opacity-60' : ''}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold
                                    ${isCheckedOut ? 'bg-green-500 text-white' : 'bg-blue-100 text-blue-600'}">
                                    ${isCheckedOut ? '✓' : index + 1}
                                </div>
                                <div>
                                    <div class="font-medium text-gray-800 ${isCheckedOut ? 'line-through' : ''}">${item.name || item.serviceName || '未知物品'}</div>
                                    <div class="text-xs text-gray-500">${item.type || item.serviceType || '标准服务'}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${isCheckedOut 
                                    ? `<span class="text-green-600 text-xs"><i class="fa fa-check-circle"></i> 已出库</span>`
                                    : `<button onclick="lightItem(${index})" 
                                        class="px-3 py-1.5 rounded-full text-xs font-bold transition-all
                                        ${isLightOn 
                                            ? 'bg-yellow-400 text-white animate-pulse' 
                                            : 'bg-gray-200 text-gray-700 hover:bg-yellow-400 hover:text-white'}">
                                        <i class="fa fa-lightbulb-o mr-1"></i>
                                        ${isLightOn ? '灯已亮' : '点亮灯条'}
                                       </button>`
                                }
                            </div>
                        </div>
                        ${item.status ? `
                            <div class="mt-3 pt-3 border-t border-gray-100">
                                <span class="status-badge ${getStatusClass(item.status)}">
                                    ${getStatusText(item.status)}
                                </span>
                            </div>
                        ` : ''}
                    </div>
                `}).join('');
            }

            // 店铺信息
            const store = orderData.store || {};
            document.getElementById('storeInfo').innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-16 h-16 bg-blue-100 rounded-xl flex items-center justify-center text-3xl">
                        🏪
                    </div>
                    <div class="flex-1">
                        <div class="font-semibold text-gray-800">${store.name || '服务网点'}</div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa fa-map-marker-alt text-primary mr-1"></i>
                            ${store.address || '地址信息待完善'}
                        </div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa fa-phone text-primary mr-1"></i>
                            ${store.phone || '400-888-8888'}
                        </div>
                    </div>
                </div>
            `;

            // 订单信息
            document.getElementById('orderNo').textContent = orderData.orderId || orderData.orderNo || '-';
            document.getElementById('createTime').textContent = orderData.createTime || 
                (orderData.createdAt ? new Date(orderData.createdAt).toLocaleString() : '-');
            document.getElementById('totalAmount').textContent = 
                orderData.fees?.total || orderData.totalAmount || orderData.amount || 0;

            // 检查是否已取件
            if (orderData.status === 'completed' || orderData.pickupConfirmed) {
                showLampOn();
            } else if (checkAllItemsCheckedOut()) {
                // 所有物品都已出库，显示确认取件按钮
                updateConfirmButton(true);
            } else {
                // 还有物品未出库，显示等待提示
                updateConfirmButton(false);
            }
        }
        
        // 更新确认按钮状态
        function updateConfirmButton(allCheckedOut) {
            const bottomAction = document.getElementById('bottomAction');
            
            if (allCheckedOut) {
                bottomAction.innerHTML = `
                    <button onclick="confirmPickup()" class="w-full py-4 bg-primary text-white rounded-xl font-semibold text-lg flex items-center justify-center gap-2" id="confirmBtn">
                        <i class="fa fa-check-circle"></i>
                        确认取件
                    </button>
                `;
            } else {
                bottomAction.innerHTML = `
                    <div class="w-full py-4 bg-gray-200 text-gray-500 rounded-xl font-semibold text-center flex items-center justify-center gap-2">
                        <i class="fa fa-clock-o"></i>
                        等待店员出库...
                    </div>
                `;
            }
        }

        // 获取状态样式
        function getStatusClass(status) {
            const map = {
                'pending': 'bg-yellow-100 text-yellow-700',
                'cleaning': 'bg-blue-100 text-blue-700',
                'cleaned': 'bg-green-100 text-green-700',
                'ready': 'bg-purple-100 text-purple-700',
                'completed': 'bg-gray-100 text-gray-700'
            };
            return map[status] || 'bg-gray-100 text-gray-700';
        }

        // 获取状态文本
        function getStatusText(status) {
            const map = {
                'pending': '待清洗',
                'cleaning': '清洗中',
                'cleaned': '清洗完成',
                'ready': '待取件',
                'completed': '已完成',
                'checked_out': '已出库',
                'awaiting_store_confirm': '待备货',
                'processing': '处理中'
            };
            return map[status] || status;
        }
        
        // 点亮单个物品灯条
        async function lightItem(itemIndex) {
            const items = orderData.items || orderData.services || [];
            const item = items[itemIndex];
            
            if (!item) {
                showToast('物品信息不存在', 'error');
                return;
            }
            
            try {
                // 获取门店ID
                const storeId = orderData.storeId || orderData.store?.id || 'ST001';
                
                // 调用正确的API点亮灯条
                const response = await fetch(`http://localhost:3000/api/store/order-light/bind`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        storeId: storeId,
                        color: 'yellow',
                        bindingType: 'pickup',
                        remark: `物品: ${item.name || item.serviceName}`
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 更新本地数据
                    items[itemIndex].lightStatus = 'on';
                    orderData.items = items;
                    
                    // 设置灯条请求到localStorage，供M端接收
                    const lightRequest = {
                        orderId: orderId,
                        itemIndex: itemIndex,
                        itemName: item.name || item.serviceName,
                        storeId: storeId,
                        timestamp: Date.now(),
                        status: 'pending'
                    };
                    localStorage.setItem(`light_request_${orderId}_${itemIndex}`, JSON.stringify(lightRequest));
                    
                    console.log('[C端] 已设置灯条请求:', lightRequest);
                    console.log('[C端] 正在同步订单到store_orders...');
                    
                    // 同步到 store_orders，供M端读取
                    syncOrderToStoreOrders();
                    
                    console.log('[C端] 订单同步完成，检查store_orders:', JSON.parse(localStorage.getItem('store_orders') || '[]').slice(-1));
                    
                    // 发送事件通知M端
                    window.dispatchEvent(new CustomEvent('lightActivated', {
                        detail: lightRequest
                    }));
                    
                    showToast(`✅ 已发送"${item.name}"灯条请求`, 'success');
                    renderPage();
                    
                    // 同时在店铺端点亮灯条
                    activateStoreLamp(itemIndex);
                } else {
                    // API返回失败，但仍然设置本地灯条请求（M端通知仍需工作）
                    console.warn('[C端] API点亮失败，但仍设置本地灯条请求:', result.error);
                    items[itemIndex].lightStatus = 'on';
                    orderData.items = items;
                    
                    const lightRequest = {
                        orderId: orderId,
                        itemIndex: itemIndex,
                        itemName: item.name || item.serviceName,
                        storeId: storeId,
                        timestamp: Date.now(),
                        status: 'pending'
                    };
                    localStorage.setItem(`light_request_${orderId}_${itemIndex}`, JSON.stringify(lightRequest));
                    syncOrderToStoreOrders();
                    
                    showToast(`✅ 已发送"${item.name}"灯条请求（M端模拟模式）`, 'success');
                    renderPage();
                    activateStoreLamp(itemIndex);
                }
            } catch (error) {
                console.warn('点亮灯条失败:', error);
                // 即使API失败，也模拟点亮效果
                items[itemIndex].lightStatus = 'on';
                orderData.items = items;
                
                const storeId = orderData.storeId || orderData.store?.id || 'ST001';
                
                // 仍然设置灯条请求
                const lightRequest = {
                    orderId: orderId,
                    itemIndex: itemIndex,
                    itemName: item.name || item.serviceName,
                    storeId: storeId,
                    timestamp: Date.now(),
                    status: 'pending'
                };
                localStorage.setItem(`light_request_${orderId}_${itemIndex}`, JSON.stringify(lightRequest));
                syncOrderToStoreOrders();
                
                showToast(`✅ 已发送"${item.name}"灯条请求`, 'success');
                renderPage();
            }
        }
        
        // 同步订单到 store_orders，供M端读取
        function syncOrderToStoreOrders() {
            const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            
            // 修复：支持多种订单ID格式的匹配
            const orderIndex = storeOrders.findIndex(o => 
                o.orderId === orderId || 
                o.id === orderId || 
                o._id === orderId
            );
            
            if (orderIndex > -1) {
                storeOrders[orderIndex] = orderData;
            } else {
                storeOrders.push(orderData);
            }
            
            localStorage.setItem('store_orders', JSON.stringify(storeOrders));
        }
        
        // 点亮所有物品灯条
        async function lightAllItems() {
            const items = orderData.items || orderData.services || [];
            const pendingItems = items.filter(item => item.itemStatus !== 'checked_out');
            
            if (pendingItems.length === 0) {
                showToast('所有物品已出库', 'info');
                return;
            }
            
            const storeId = orderData.storeId || orderData.store?.id || 'ST001';
            let successCount = 0;
            
            for (let i = 0; i < items.length; i++) {
                if (items[i].itemStatus !== 'checked_out') {
                    try {
                        // 调用正确的API，传递itemIndex参数
                        const response = await fetch(`http://localhost:3000/api/store/order-light/bind`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderId: orderId,
                                storeId: storeId,
                                color: 'yellow',
                                bindingType: 'pickup',
                                itemIndex: i,  // 传递物品索引，支持一个订单绑定多个灯条
                                remark: `物品: ${items[i].name || items[i].serviceName}`
                            })
                        });
                        
                        const result = await response.json();
                        
                        if (result.success) {
                            items[i].lightStatus = 'on';
                            successCount++;
                        } else {
                            console.warn(`点亮物品 ${i} 失败:`, result.error);
                            // API失败时也标记为已点亮（M端模拟模式）
                            items[i].lightStatus = 'on';
                            successCount++;
                        }
                    } catch (error) {
                        console.warn(`点亮物品 ${i} 失败:`, error);
                        // 即使API失败也设置灯条请求
                        items[i].lightStatus = 'on';
                        successCount++;
                    }
                    
                    // 设置灯条请求到localStorage
                    const lightRequest = {
                        orderId: orderId,
                        itemIndex: i,
                        itemName: items[i].name || items[i].serviceName,
                        storeId: storeId,
                        timestamp: Date.now(),
                        status: 'pending'
                    };
                    localStorage.setItem(`light_request_${orderId}_${i}`, JSON.stringify(lightRequest));
                    
                    activateStoreLamp(i);
                }
            }
            
            orderData.items = items;
            
            // 同步到 store_orders
            syncOrderToStoreOrders();
            
            // 收集所有待点亮物品的信息（格式与m端期望的一致）
            const allLightItems = items
                .map((item, index) => ({
                    itemId: `${orderId}_${index}`,
                    itemIndex: index,
                    lampIndex: index,  // m端期望的属性名
                    itemName: item.name || item.serviceName,
                    orderId: orderId,
                    lightStatus: item.lightStatus || 'on'
                }))
                .filter(item => item.lightStatus === 'on');
            
            // 更新 store_light_request，m端通过此key检测灯条请求
            const storeLightRequest = {
                type: 'light_all_items',
                orderId: orderId,
                storeId: storeId,
                items: allLightItems,
                itemCount: allLightItems.length,
                timestamp: Date.now(),
                customerId: localStorage.getItem('userId'),
                status: 'pending'
            };
            localStorage.setItem('store_light_request', JSON.stringify(storeLightRequest));
            
            console.log('[C端] 已更新store_light_request，包含', allLightItems.length, '个待点亮物品:', allLightItems.map(i => i.itemName).join(', '));
            
            // 发送事件通知M端
            window.dispatchEvent(new CustomEvent('lightActivated', {
                detail: { orderId: orderId, count: successCount, items: allLightItems }
            }));
            
            showToast(`✅ 已发送${successCount}个灯条请求`, 'success');
            renderPage();
        }
        
        // 激活店铺灯条
        function activateStoreLamp(index) {
            const lamps = document.querySelectorAll('.lamp-bulb');
            if (lamps[index]) {
                lamps[index].classList.remove('bg-gray-200');
                lamps[index].classList.add('bg-yellow-400', 'shadow-lg');
                lamps[index].style.boxShadow = '0 0 15px rgba(251, 191, 36, 0.8)';
                lamps[index].classList.add('animate-pulse');
            }
        }
        
        // 检查是否所有物品都已出库
        function checkAllItemsCheckedOut() {
            const items = orderData.items || orderData.services || [];
            return items.length > 0 && items.every(item => item.itemStatus === 'checked_out');
        }
        
        // 确认取件
        async function confirmPickup() {
            if (!confirm('确认已到店取件吗？')) return;

            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 处理中...';

            try {
                // 调用API
                const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/pickup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pickupMethod: 'store_pickup',
                        pickupTime: new Date().toISOString()
                    })
                });
                const result = await response.json();
                
                // 更新本地数据
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                const idx = orders.findIndex(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
                if (idx > -1) {
                    orders[idx].status = 'completed';
                    orders[idx].pickupConfirmed = true;
                    orders[idx].completedAt = new Date().toISOString();
                    localStorage.setItem('orders', JSON.stringify(orders));
                }

                // 点亮灯条
                showLampOn();
                
                // 显示成功提示
                showToast('取件成功！订单已完成', 'success');
                
            } catch (error) {
                console.error('API调用失败:', error);
                alert('取件确认失败，请稍后重试：' + (error.message || '网络错误'));
                btn.disabled = false;
                btn.innerHTML = '✅ 确认已取件';
            }
        }

        // 点亮灯条
        function showLampOn() {
            const lamp = document.getElementById('lampIndicator');
            lamp.classList.remove('lamp-off');
            lamp.classList.add('lamp-on');
            lamp.innerHTML = '✨';
            
            document.getElementById('lampStatus').textContent = '取件完成';
            document.getElementById('lampStatus').classList.add('text-green-600');
            document.getElementById('lampDesc').textContent = '感谢您的使用，欢迎再次光临！';
            document.getElementById('lampHint').textContent = '店铺灯条已点亮';
            
            // 点亮灯条灯泡
            document.querySelectorAll('.lamp-bulb').forEach((bulb, index) => {
                setTimeout(() => {
                    bulb.classList.remove('bg-gray-200');
                    bulb.classList.add('bg-yellow-400', 'shadow-lg');
                    bulb.style.boxShadow = '0 0 15px rgba(251, 191, 36, 0.8)';
                }, index * 100);
            });
            
            // 隐藏确认按钮
            document.getElementById('bottomAction').innerHTML = `
                <button onclick="goBack()" class="w-full py-4 bg-green-500 text-white rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                    <i class="fa fa-check-circle"></i>
                    已完成，返回订单列表
                </button>
            `;
        }

        // 返回订单列表
        function goBack() {
            window.location.href = 'c-orders.html';
        }

        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            toast.innerHTML = `<i class="fa fa-${type === 'success' ? 'check' : 'exclamation'}-circle mr-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
