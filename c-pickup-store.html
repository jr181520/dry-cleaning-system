<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>到店自提 - 干洗服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .item-card {
            background: #ffffff;
            border-radius: 16rpx;
            padding: 20rpx;
            margin-bottom: 16rpx;
            box-shadow: 0 2rpx 8rpx rgba(0,0,0,0.04);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4rpx 12rpx;
            border-radius: 8rpx;
            font-size: 22rpx;
        }
        .lamp-indicator {
            width: 120rpx;
            height: 120rpx;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48rpx;
            transition: all 0.5s ease;
        }
        .lamp-off {
            background: #e5e7eb;
            color: #9ca3af;
            box-shadow: inset 0 2rpx 8rpx rgba(0,0,0,0.1);
        }
        .lamp-on {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #fff;
            box-shadow: 0 0 40rpx rgba(251, 191, 36, 0.6), 0 4rpx 12rpx rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">
    <!-- 顶部导航 -->
    <header class="bg-white sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100">
            <a href="c-orders.html" class="text-gray-700">
                <i class="fa fa-arrow-left text-lg"></i>
            </a>
            <span class="text-lg font-semibold text-gray-800">到店自提</span>
            <span class="w-8"></span>
        </div>
    </header>

    <!-- 灯条状态 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-6 text-center shadow-sm">
        <div class="lamp-indicator lamp-off mx-auto mb-4" id="lampIndicator">
            💡
        </div>
        <h3 class="text-lg font-semibold text-gray-800 mb-2" id="lampStatus">等待取件确认</h3>
        <p class="text-sm text-gray-500" id="lampDesc">点击下方"确认取件"按钮点亮灯条</p>
        
        <!-- 灯条可视化 -->
        <div class="mt-4 flex justify-center gap-2" id="lampStrip">
            <div class="lamp-bulb bg-gray-200 w-8 h-8 rounded-full transition-all duration-500" data-index="0"></div>
            <div class="lamp-bulb bg-gray-200 w-8 h-8 rounded-full transition-all duration-500" data-index="1"></div>
            <div class="lamp-bulb bg-gray-200 w-8 h-8 rounded-full transition-all duration-500" data-index="2"></div>
            <div class="lamp-bulb bg-gray-200 w-8 h-8 rounded-full transition-all duration-500" data-index="3"></div>
            <div class="lamp-bulb bg-gray-200 w-8 h-8 rounded-full transition-all duration-500" data-index="4"></div>
        </div>
        <p class="text-xs text-gray-400 mt-2" id="lampHint">店铺灯条状态</p>
    </div>

    <!-- 物品明细 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-list text-primary"></i>
            物品明细
        </h3>
        <div id="itemsList">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 店铺信息 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-store text-primary"></i>
            店铺信息
        </h3>
        <div id="storeInfo">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 订单信息 -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4">
        <h3 class="text-base font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa fa-info-circle text-primary"></i>
            订单信息
        </h3>
        <div class="space-y-3 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">订单编号</span>
                <span class="text-gray-800 font-mono" id="orderNo">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">下单时间</span>
                <span class="text-gray-800" id="createTime">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">订单金额</span>
                <span class="text-red-500 font-semibold text-lg">¥<span id="totalAmount">0</span></span>
            </div>
        </div>
    </div>

    <!-- 底部确认按钮 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 shadow-lg" id="bottomAction">
        <button onclick="confirmPickup()" class="w-full py-4 bg-primary text-white rounded-xl font-semibold text-lg flex items-center justify-center gap-2" id="confirmBtn">
            <i class="fa fa-check-circle"></i>
            确认取件
        </button>
    </div>

    <script>
        let orderId = null;
        let orderData = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            orderId = urlParams.get('id');
            
            if (!orderId) {
                alert('订单ID不能为空');
                window.location.href = 'c-orders.html';
                return;
            }

            await loadOrderData();
        });

        // 加载订单数据
        async function loadOrderData() {
            // 先从localStorage查找
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orderData = orders.find(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
            
            // 如果本地没有，尝试从API获取
            if (!orderData) {
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || ''),
                            'Cache-Control': 'no-cache'
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        orderData = result.data;
                    }
                } catch (error) {
                    console.warn('从API获取订单失败:', error);
                }
            }

            if (!orderData) {
                alert('未找到订单信息');
                window.location.href = 'c-orders.html';
                return;
            }

            renderPage();
        }

        // 渲染页面
        function renderPage() {
            // 物品列表
            const items = orderData.items || orderData.services || [];
            const itemsListEl = document.getElementById('itemsList');
            
            if (items.length === 0) {
                itemsListEl.innerHTML = '<p class="text-gray-500 text-center py-4">暂无物品信息</p>';
            } else {
                itemsListEl.innerHTML = items.map((item, index) => `
                    <div class="item-card">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-semibold">
                                    ${index + 1}
                                </span>
                                <div>
                                    <div class="font-medium text-gray-800">${item.name || item.serviceName || '未知物品'}</div>
                                    <div class="text-xs text-gray-500">${item.type || item.serviceType || '标准服务'}</div>
                                </div>
                            </div>
                            <span class="text-red-500 font-semibold">¥${item.price || item.unitPrice || 0}</span>
                        </div>
                        ${item.status ? `
                            <div class="mt-3 pt-3 border-t border-gray-100">
                                <span class="status-badge ${getStatusClass(item.status)}">
                                    ${getStatusText(item.status)}
                                </span>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            // 店铺信息
            const store = orderData.store || {};
            document.getElementById('storeInfo').innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-16 h-16 bg-blue-100 rounded-xl flex items-center justify-center text-3xl">
                        🏪
                    </div>
                    <div class="flex-1">
                        <div class="font-semibold text-gray-800">${store.name || '服务网点'}</div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa fa-map-marker-alt text-primary mr-1"></i>
                            ${store.address || '地址信息待完善'}
                        </div>
                        <div class="text-sm text-gray-500 mt-1">
                            <i class="fa fa-phone text-primary mr-1"></i>
                            ${store.phone || '400-888-8888'}
                        </div>
                    </div>
                </div>
            `;

            // 订单信息
            document.getElementById('orderNo').textContent = orderData.orderId || orderData.orderNo || '-';
            document.getElementById('createTime').textContent = orderData.createTime || 
                (orderData.createdAt ? new Date(orderData.createdAt).toLocaleString() : '-');
            document.getElementById('totalAmount').textContent = 
                orderData.fees?.total || orderData.totalAmount || orderData.amount || 0;

            // 检查是否已取件
            if (orderData.status === 'completed' || orderData.pickupConfirmed) {
                showLampOn();
            }
        }

        // 获取状态样式
        function getStatusClass(status) {
            const map = {
                'pending': 'bg-yellow-100 text-yellow-700',
                'cleaning': 'bg-blue-100 text-blue-700',
                'cleaned': 'bg-green-100 text-green-700',
                'ready': 'bg-purple-100 text-purple-700',
                'completed': 'bg-gray-100 text-gray-700'
            };
            return map[status] || 'bg-gray-100 text-gray-700';
        }

        // 获取状态文本
        function getStatusText(status) {
            const map = {
                'pending': '待清洗',
                'cleaning': '清洗中',
                'cleaned': '清洗完成',
                'ready': '待取件',
                'completed': '已完成'
            };
            return map[status] || status;
        }

        // 确认取件
        async function confirmPickup() {
            if (!confirm('确认已到店取件吗？')) return;

            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 处理中...';

            try {
                // 调用API
                const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/pickup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pickupMethod: 'store_pickup',
                        pickupTime: new Date().toISOString()
                    })
                });
                const result = await response.json();
                
                // 更新本地数据
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                const idx = orders.findIndex(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
                if (idx > -1) {
                    orders[idx].status = 'completed';
                    orders[idx].pickupConfirmed = true;
                    orders[idx].completedAt = new Date().toISOString();
                    localStorage.setItem('orders', JSON.stringify(orders));
                }

                // 点亮灯条
                showLampOn();
                
                // 显示成功提示
                showToast('取件成功！订单已完成', 'success');
                
            } catch (error) {
                console.warn('API调用失败:', error);
                // 即使API失败也更新本地状态
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                const idx = orders.findIndex(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
                if (idx > -1) {
                    orders[idx].status = 'completed';
                    orders[idx].pickupConfirmed = true;
                    orders[idx].completedAt = new Date().toISOString();
                    localStorage.setItem('orders', JSON.stringify(orders));
                }
                showLampOn();
                showToast('取件成功！订单已完成', 'success');
            }
        }

        // 点亮灯条
        function showLampOn() {
            const lamp = document.getElementById('lampIndicator');
            lamp.classList.remove('lamp-off');
            lamp.classList.add('lamp-on');
            lamp.innerHTML = '✨';
            
            document.getElementById('lampStatus').textContent = '取件完成';
            document.getElementById('lampStatus').classList.add('text-green-600');
            document.getElementById('lampDesc').textContent = '感谢您的使用，欢迎再次光临！';
            document.getElementById('lampHint').textContent = '店铺灯条已点亮';
            
            // 点亮灯条灯泡
            document.querySelectorAll('.lamp-bulb').forEach((bulb, index) => {
                setTimeout(() => {
                    bulb.classList.remove('bg-gray-200');
                    bulb.classList.add('bg-yellow-400', 'shadow-lg');
                    bulb.style.boxShadow = '0 0 15px rgba(251, 191, 36, 0.8)';
                }, index * 100);
            });
            
            // 隐藏确认按钮
            document.getElementById('bottomAction').innerHTML = `
                <button onclick="goBack()" class="w-full py-4 bg-green-500 text-white rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                    <i class="fa fa-check-circle"></i>
                    已完成，返回订单列表
                </button>
            `;
        }

        // 返回订单列表
        function goBack() {
            window.location.href = 'c-orders.html';
        }

        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            toast.innerHTML = `<i class="fa fa-${type === 'success' ? 'check' : 'exclamation'}-circle mr-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
