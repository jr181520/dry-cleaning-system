<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 干洗服务</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc',
                        info: '#3b82f6',
                        purple: '#8b5cf6',
                        pink: '#ec4899',
                        teal: '#14b8a6',
                        orange: '#f97316'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(to right, #1e40af, #3b82f6);
            }
            .bg-gradient {
                background-image: linear-gradient(to right, #1e40af, #3b82f6);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-6">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gradient">干洗服务</h1>
                <p class="text-gray-600 mt-2">登录您的账户</p>
            </div>
            
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-phone"></i>
                        </span>
                        <input type="tel" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入手机号">
                    </div>
                </div>
                
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-sm font-medium text-gray-700">密码</label>
                        <a href="#" class="text-sm text-primary hover:underline">忘记密码？</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入密码">
                        <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500" id="toggle-password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors">
                    登录
                </button>
                
                <div class="mt-4 text-center">
                    <span class="text-gray-600">还没有账户？</span>
                    <a href="c-register.html" class="text-primary hover:underline ml-1">立即注册</a>
                </div>
            </form>
            
            <!-- 测试账号快捷登录 -->
            <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
                <div class="text-sm text-blue-800 mb-3">
                    <i class="fa fa-flask mr-1"></i> 测试模式 - 快捷登录
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="quickLogin('13800001001')" class="px-3 py-2 bg-white border border-blue-200 rounded-lg text-sm text-blue-700 hover:bg-blue-50 transition-colors">
                        <div class="font-medium">用户测试</div>
                        <div class="text-xs text-gray-500">13800001001</div>
                    </button>
                    <button onclick="quickLoginStaff()" class="px-3 py-2 bg-white border border-green-200 rounded-lg text-sm text-green-700 hover:bg-green-50 transition-colors">
                        <div class="font-medium">店员请走这边</div>
                        <div class="text-xs text-gray-500">→ m-login</div>
                    </button>
                </div>
            </div>
            
                <div class="mt-6">
                <div class="flex items-center justify-center mb-4">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="px-4 text-gray-500 text-sm">其他登录方式</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>
                
                <div class="flex justify-center space-x-6">
                    <button onclick="wechatWebLogin()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors" title="微信登录">
                        <i class="fa fa-weixin text-green-500"></i>
                    </button>
                    <button onclick="showToast('暂不支持', 'none')" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i class="fa fa-qq text-blue-500"></i>
                    </button>
                    <button onclick="showToast('暂不支持', 'none')" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i class="fa fa-weibo text-red-500"></i>
                    </button>
                </div>
                
                <!-- 微信登录弹窗 -->
                <div id="wechat-login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
                        <div class="text-center">
                            <h3 class="text-lg font-medium mb-4">微信登录</h3>
                            <div id="wechat-qrcode" class="mb-4 flex justify-center">
                                <div class="loading-spinner">
                                    <i class="fa fa-spinner fa-spin text-3xl text-gray-400"></i>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600 mb-4">请使用微信扫描二维码登录</p>
                            <button onclick="closeWechatLogin()" class="text-gray-500 hover:text-gray-700">
                                取消
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/auth';
        
        // 检查是否已登录
        if (localStorage.getItem('userToken')) {
            window.location.href = 'c-index.html';
        }
        
        // 检查URL是否有微信登录回调参数
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('wechat_login') === '1') {
            const openid = urlParams.get('openid');
            const token = urlParams.get('token');
            
            if (openid && token) {
                // 保存登录信息
                localStorage.setItem('userToken', token);
                localStorage.setItem('userOpenid', openid);
                
                // 获取用户信息
                fetchUserInfo(token).then(() => {
                    showToast('微信登录成功！', 'success');
                    setTimeout(() => window.location.href = 'c-index.html', 1000);
                });
            }
        }
        
        // 检查URL错误参数
        const errorMsg = urlParams.get('error');
        if (errorMsg) {
            showToast('登录失败: ' + decodeURIComponent(errorMsg), 'error');
        }
        
        // 获取用户信息
        async function fetchUserInfo(token) {
            try {
                const response = await fetch(`${API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('userInfo', JSON.stringify(result.data));
                    localStorage.setItem('userPhone', result.data.phone || '');
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }
        
        // 微信网页登录
        async function wechatWebLogin() {
            try {
                // 获取授权URL
                const response = await fetch(`${API_BASE}/wechat/authorize`);
                const result = await response.json();
                
                if (result.success && result.data.authorizeUrl) {
                    // 跳转到微信授权页面
                    window.location.href = result.data.authorizeUrl;
                } else {
                    // 如果没有配置微信参数，使用测试模式
                    showToast('微信登录未配置，使用测试模式', 'none');
                    await wechatTestLogin();
                }
            } catch (error) {
                console.error('获取授权URL失败:', error);
                showToast('微信登录请求失败', 'error');
            }
        }
        
        // 微信测试登录（用于开发环境）
        async function wechatTestLogin() {
            const testOpenid = 'oTest_' + Date.now();
            const testNickname = '测试用户_' + Math.floor(Math.random() * 1000);
            
            try {
                const response = await fetch(`${API_BASE}/wechat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        openid: testOpenid,
                        nickname: testNickname,
                        sex: 1,
                        platform: 'wechat_web_test'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存登录信息
                    localStorage.setItem('userToken', result.data.token);
                    localStorage.setItem('userOpenid', result.data.openid || testOpenid);
                    localStorage.setItem('userInfo', JSON.stringify(result.data.user));
                    localStorage.setItem('userPhone', result.data.user.phone || '');
                    
                    showToast('测试登录成功！', 'success');
                    setTimeout(() => window.location.href = 'c-index.html', 1000);
                } else {
                    showToast(result.error || '登录失败', 'error');
                }
            } catch (error) {
                console.error('测试登录失败:', error);
                showToast('网络错误，请稍后重试', 'error');
            }
        }

        // 切换密码可见性
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = this.previousElementSibling;
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phoneInput = this.querySelector('input[type="tel"]');
            const passwordInput = this.querySelector('input[type="password"]');
            const phone = phoneInput.value.trim();
            const password = passwordInput.value;
            
            if (!phone || !password) {
                showToast('请填写完整的登录信息', 'error');
                return;
            }
            
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>登录中...';
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存登录信息
                    localStorage.setItem('userToken', result.data.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.data.user));
                    localStorage.setItem('userPhone', phone);
                    showToast('登录成功！');
                    setTimeout(() => window.location.href = 'c-index.html', 500);
                } else {
                    showToast(result.error || '登录失败', 'error');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showToast('网络错误，请检查后端服务', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '登录';
            }
        });

        // Toast提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50 ${
                type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'
            } text-white font-medium`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 模拟测试账号登录
        function quickLogin(phone) {
            const mockUsers = {
                '13800001001': { id: 'mock-user-001', userNo: 'U001', phone: '13800001001', name: '测试用户', roles: ['customer'], balance: 500, points: 1280 }
            };
            
            const user = mockUsers[phone];
            if (user) {
                localStorage.setItem('userToken', 'mock-token-' + phone);
                localStorage.setItem('userInfo', JSON.stringify(user));
                localStorage.setItem('userPhone', phone);
                localStorage.setItem('isMockUser', 'true');
                showToast(`模拟登录成功: ${user.name}`);
                setTimeout(() => window.location.href = 'c-index.html', 500);
            }
        }
        
        // 店员跳转门店端登录
        function quickLoginStaff() {
            showToast('店员请使用门店端登录', 'info');
            setTimeout(() => window.location.href = 'm-login.html', 1000);
        }
    </script>
</body>
</html>
