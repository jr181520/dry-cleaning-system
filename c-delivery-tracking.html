<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>配送跟踪 - 干洗服务</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        
        /* 顶部导航 */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-title { color: white; font-weight: 600; font-size: 18px; }
        .nav-back {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none;
        }
        
        /* 主内容区 */
        .main-content {
            padding-top: 70px;
            padding-bottom: 100px;
            max-width: 480px;
            margin: 0 auto;
        }
        
        /* 配送状态卡片 */
        .status-card {
            background: white;
            border-radius: 20px;
            margin: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .status-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .status-icon.awaiting_store_outbound { background: #f3e8ff; color: #7c3aed; }
        .status-icon.picking { background: #e3f2fd; color: #2196f3; }
        .status-icon.delivering { background: #fff3e0; color: #ff9800; }
        .status-icon.delivered { background: #e8f5e9; color: #4caf50; }
        .status-info { flex: 1; }
        .status-title { font-size: 20px; font-weight: 700; color: #333; }
        .status-subtitle { font-size: 14px; color: #666; margin-top: 4px; }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f5e9;
            color: #4caf50;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .live-dot {
            width: 8px; height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* 配送员信息卡片 */
        .driver-card {
            background: linear-gradient(135deg, #f5f7ff 0%, #fff 100%);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #e8eaf6;
        }
        .driver-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .driver-avatar {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 28px;
        }
        .driver-meta { flex: 1; }
        .driver-name { font-size: 18px; font-weight: 700; color: #333; }
        .driver-rating {
            display: flex; align-items: center;
            gap: 4px; margin-top: 4px;
            font-size: 13px; color: #ff9800;
        }
        .driver-stats {
            display: flex;
            gap: 16px;
            padding-top: 12px;
            border-top: 1px solid #e8eaf6;
        }
        .stat-item { text-align: center; flex: 1; }
        .stat-value { font-size: 18px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 12px; color: #999; margin-top: 2px; }
        .driver-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .action-btn.call {
            background: #4caf50;
            color: white;
        }
        .action-btn.message {
            background: #f5f5f5;
            color: #666;
        }
        .action-btn:active { transform: scale(0.98); }
        
        /* 进度时间线 */
        .timeline-card {
            background: white;
            border-radius: 20px;
            margin: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .timeline-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timeline {
            position: relative;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e0e0e0;
        }
        .timeline-item {
            display: flex;
            gap: 16px;
            padding-bottom: 24px;
            position: relative;
        }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-dot {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .timeline-item.completed .timeline-dot { background: #4caf50; }
        .timeline-item.active .timeline-dot { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }
        .timeline-item.pending .timeline-dot { background: #e0e0e0; color: #999; }
        .timeline-content { flex: 1; padding-top: 4px; }
        .timeline-step-title { font-weight: 600; color: #333; font-size: 15px; }
        .timeline-step-desc { font-size: 13px; color: #999; margin-top: 4px; }
        .timeline-time { font-size: 12px; color: #bbb; margin-top: 6px; }
        
        /* 地图区域（模拟） */
        .map-card {
            background: white;
            border-radius: 20px;
            margin: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .map-container {
            height: 200px;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .map-route {
            position: absolute;
            top: 50%;
            left: 20%;
            right: 20%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transform: translateY(-50%);
        }
        .map-point {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 4px solid #667eea;
        }
        .map-point.start { left: 20%; }
        .map-point.end { right: 20%; }
        .map-rider {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #ff5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.4);
            animation: riderMove 3s ease-in-out infinite;
        }
        @keyframes riderMove {
            0%, 100% { left: 30%; }
            50% { left: 70%; }
        }
        .map-info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding: 0 8px;
        }
        .map-location { text-align: center; }
        .map-location-name { font-weight: 600; color: #333; font-size: 14px; }
        .map-location-addr { font-size: 12px; color: #999; margin-top: 2px; }
        
        /* 订单信息 */
        .order-card {
            background: white;
            border-radius: 20px;
            margin: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .order-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e3f2fd;
            color: #2196f3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .order-price { font-size: 20px; font-weight: 700; color: #ff5722; }
        .order-items { 
            border-top: 1px solid #f0f0f0;
            padding-top: 12px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .order-item-name { color: #666; }
        .order-item-count { color: #999; }
        
        /* 底部操作栏 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .bottom-btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .bottom-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .bottom-btn.secondary {
            background: #f5f5f5;
            color: #666;
        }
        .bottom-btn.success {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
        }
        .bottom-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .bottom-btn:active:not(:disabled) { transform: scale(0.98); }
        
        /* 确认收货弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .modal-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 40px;
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #333; }
        .modal-desc { font-size: 14px; color: #666; margin-top: 8px; }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        /* 隐藏类 */
        .hidden { display: none !important; }
    </style>
    <!-- 用户数据隔离模块 -->
    <script src="js/user-data-isolation.js"></script>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav-header">
        <a href="javascript:history.back()" class="nav-back">
            <i class="fas fa-arrow-left"></i>
        </a>
        <span class="nav-title">配送跟踪</span>
        <div style="width: 36px;"></div>
    </div>
    
    <!-- 主内容 -->
    <div class="main-content">
        <!-- 配送状态卡片 -->
        <div class="status-card">
            <div class="status-header">
                <div class="status-icon picking" id="statusIcon">
                    <i class="fas fa-motorcycle"></i>
                </div>
                <div class="status-info">
                    <div class="status-title" id="statusTitle">骑手取件中</div>
                    <div class="status-subtitle" id="statusSubtitle">预计15分钟内到达</div>
                </div>
                <span class="live-badge" id="liveBadge">
                    <span class="live-dot"></span>
                    实时
                </span>
            </div>
            
            <!-- 配送员信息 -->
            <div class="driver-card">
                <div class="driver-header">
                    <div class="driver-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="driver-meta">
                        <div class="driver-name" id="driverName">张师傅</div>
                        <div class="driver-rating">
                            <i class="fas fa-star"></i>
                            <span id="driverRating">4.9分</span>
                            <span style="color: #999; margin-left: 8px;" id="driverOrders">已完成1288单</span>
                        </div>
                    </div>
                </div>
                <div class="driver-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="statDistance">1.5km</div>
                        <div class="stat-label">距离</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statTime">15分钟</div>
                        <div class="stat-label">预计时间</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statTemp">26°C</div>
                        <div class="stat-label">天气</div>
                    </div>
                </div>
                <div class="driver-actions">
                    <button class="action-btn call" onclick="callDriver()">
                        <i class="fas fa-phone"></i>
                        电话联系
                    </button>
                    <button class="action-btn message" onclick="messageDriver()">
                        <i class="fas fa-comment"></i>
                        在线联系
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 地图模拟 -->
        <div class="map-card">
            <div class="map-container">
                <div class="map-route"></div>
                <div class="map-point start"></div>
                <div class="map-point end"></div>
                <div class="map-rider">
                    <i class="fas fa-motorcycle"></i>
                </div>
            </div>
            <div class="map-info">
                <div class="map-location">
                    <div class="map-location-name" id="startLocation">取件地址</div>
                    <div class="map-location-addr" id="startAddr">用户位置</div>
                </div>
                <div class="map-location">
                    <div class="map-location-name" id="endLocation">送达地址</div>
                    <div class="map-location-addr" id="endAddr">门店位置</div>
                </div>
            </div>
        </div>
        
        <!-- 配送进度 -->
        <div class="timeline-card">
            <div class="timeline-title">
                <i class="fas fa-route" style="color: #667eea;"></i>
                配送进度
            </div>
            <div class="timeline" id="deliveryTimeline">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <!-- 订单信息 -->
        <div class="order-card">
            <div class="order-header">
                <span class="order-type" id="deliveryType">
                    <i class="fas fa-arrow-up"></i>
                    送件到门店
                </span>
                <span class="order-price" id="deliveryFee">¥15.00</span>
            </div>
            <div class="order-items" id="orderItems">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 底部操作栏 -->
    <div class="bottom-bar" id="bottomBar">
        <button class="bottom-btn secondary" onclick="refreshStatus()">
            <i class="fas fa-sync-alt"></i> 刷新
        </button>
        <button class="bottom-btn primary" id="mainAction" onclick="handleMainAction()">
            确认送达
        </button>
    </div>
    
    <!-- 确认收货弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="modal-title">确认已收到物品？</div>
            <div class="modal-desc">请确认配送员已将物品送达，确认后订单将标记为已完成</div>
            <div class="modal-actions">
                <button class="bottom-btn secondary" onclick="closeModal()" style="flex: 1;">取消</button>
                <button class="bottom-btn success" onclick="confirmReceived()" style="flex: 1;">确认收货</button>
            </div>
        </div>
    </div>
    
    <script>
        // 配送阶段配置（基于服务商回传状态）
        const DELIVERY_STAGES = {
            pickup: {
                title: '骑手取件中',
                subtitle: '预计15分钟内到达',
                icon: 'fa-motorcycle',
                iconClass: 'picking',
                steps: [
                    { key: 'awaiting_store_outbound', title: '商家待出库', desc: '门店正在准备物品', icon: 'fa-box' },
                    { key: 'picking', title: '骑手待取件', desc: '骑手正在前往门店取件', icon: 'fa-motorcycle' },
                    { key: 'delivering', title: '配送中', desc: '骑手正在配送途中', icon: 'fa-truck' },
                    { key: 'delivered', title: '已送达', desc: '物品已送达，请查收', icon: 'fa-home' }
                ]
            },
            return: {
                title: '骑手送件中',
                subtitle: '预计20分钟内送达',
                icon: 'fa-motorcycle',
                iconClass: 'delivering',
                steps: [
                    { key: 'awaiting_store_outbound', title: '商家待出库', desc: '门店正在准备物品', icon: 'fa-box' },
                    { key: 'picking', title: '骑手待取件', desc: '骑手正在前往门店取件', icon: 'fa-motorcycle' },
                    { key: 'delivering', title: '配送中', desc: '骑手正在配送途中', icon: 'fa-truck' },
                    { key: 'delivered', title: '已送达', desc: '物品已送达，请查收', icon: 'fa-home' }
                ]
            }
        };
        
        // 订单状态到配送阶段的映射（基于服务商回传）
        const STATUS_TO_STAGE = {
            'awaiting_store_outbound': 0,  // 商家待出库
            'picking': 1,                  // 骑手待取件
            'delivering': 2,               // 配送中
            'delivering_back': 2,          // 配送中（送回）
            'courier_delivering': 2,       // 骑手配送中
            'almost_there': 2,             // 即将送达→配送中
            'delivered': 3,                // 已送达
            'completed': 3                 // 已送达/已完成
        };
        
        let currentOrder = null;
        let deliveryType = 'pickup'; // 根据订单数据动态检测：pickup=用户→门店, return=门店→用户
        let currentStage = 'awaiting_store_outbound';
        let orderId = null;
        let _serverOrderCache = null; // API返回的最新订单缓存，避免 localStorage 脏数据覆盖
        
        // 初始化 — 优先从 API 获取权威数据，localStorage 仅作 fallback
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            orderId = urlParams.get('orderId');
            
            if (!orderId) {
                showDemoData();
                return;
            }
            
            // 第一步：从 localStorage 快速展示（即时渲染）
            loadFromLocalStorage();
            renderTimeline();
            
            // 第二步：从后端 API 获取权威数据并更新
            await fetchAndApplyServerOrder();
            
            // 开始实时轮询
            startRealtimeUpdate();
        }
        
        // 从 localStorage 加载（仅用于首屏快速展示，不做 stage 重置）
        function loadFromLocalStorage() {
            const orders = getUserOrders();
            const order = orders.find(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
            if (order) {
                currentOrder = order;
                deliveryType = detectDeliveryType(order);
                updateDriverInfo();
                updateOrderInfo();
            }
        }
        
        // 从 API 获取订单并应用到 UI（权威数据源）
        async function fetchAndApplyServerOrder() {
            try {
                const token = localStorage.getItem('userToken') || localStorage.getItem('authToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;
                
                const resp = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                    headers,
                    signal: AbortSignal.timeout(5000)
                });
                if (!resp.ok) return;
                
                const result = await resp.json();
                const serverOrder = result.data || result;
                if (!serverOrder) return;
                
                _serverOrderCache = serverOrder;
                applyServerOrder(serverOrder, true);
            } catch (e) {
                console.log('[配送跟踪] API 初始加载失败，使用 localStorage 数据');
            }
        }
        
        // 将订单数据应用到 UI（统一的入口）
        function applyServerOrder(serverOrder, isInitial = false) {
            // 合并 serverOrder 到 currentOrder（保留 localStorage 的本地字段）
            currentOrder = { ...currentOrder, ...serverOrder };
            
            // 检测配送方向
            const detectedType = detectDeliveryType(currentOrder);
            if (deliveryType !== detectedType) {
                console.log('[配送跟踪] 配送方向修正:', deliveryType, '→', detectedType);
                deliveryType = detectedType;
            }
            
            // 映射 courier 状态到 stage
            const courierStatus = serverOrder.courier?.status
                || serverOrder.courierStatus
                || serverOrder.deliveryStatus;
            
            const prevStage = currentStage;
            if (courierStatus === 'awaiting_store_outbound') {
                currentStage = 'awaiting_store_outbound';
            } else if (courierStatus === 'picking') {
                currentStage = 'picking';
            } else if (courierStatus === 'delivering' || serverOrder.status === 'delivering_back') {
                currentStage = 'delivering';
            } else if (courierStatus === 'delivered' || serverOrder.status === 'completed') {
                currentStage = 'delivered';
            } else if (isInitial) {
                // 初次加载且 courierStatus 未知：根据订单 orderStatus 兜底
                currentStage = mapOrderStatusToStage(serverOrder.status);
            }
            // 非初次且 courierStatus 未知 → 保持 currentStage 不变（避免闪烁）
            
            if (currentStage !== prevStage) {
                console.log('[配送跟踪] 阶段变更:', prevStage, '→', currentStage, '| courier:', courierStatus);
            }
            
            updateDeliveryUI();
            updateOrderInfo();
            updateTimelineStage();
            updateDriverInfo();
        }
        
        // 检测配送方向：根据多种字段综合判断
        function detectDeliveryType(order) {
            // 1. 优先使用后端 delivery.type（权威字段）
            if (order.delivery?.type === 'pickup') return 'pickup';
            if (order.delivery?.type === 'delivery') return 'return';
            
            // 2. 根据 deliveryStatus 判断（前端 localStorage 订单使用此字段）
            //    pending_pickup = 等待骑手来取件（用户→门店）
            //    其他 courier 状态 = 骑手在配送中
            if (order.deliveryStatus === 'pending_pickup') return 'pickup';
            
            // 3. deliveryMethod 为 courier 且 courier.status 处于早期阶段 → pickup
            if (order.deliveryMethod === 'courier' || order.selectedProvider) {
                const cs = order.courier?.status || order.courierStatus;
                // 初始阶段（尚未配送或刚取件）→ pickup
                if (!cs || cs === 'awaiting_store_outbound' || cs === 'picking') return 'pickup';
                // 配送中或已送达 → return
                return 'return';
            }
            
            // 4. 默认取件方向
            return 'pickup';
        }
        
        // 根据订单主状态兜底映射 stage（courier 状态不可用时）
        function mapOrderStatusToStage(orderStatus) {
            const map = {
                'pending': 'awaiting_store_outbound',
                'received': 'awaiting_store_outbound',
                'cleaning': 'awaiting_store_outbound',
                'cleaned': 'picking',
                'delivering_back': 'delivering',
                'delivering': 'delivering',
                'completed': 'delivered'
            };
            return map[orderStatus] || 'awaiting_store_outbound';
        }
        
        // 更新骑手信息
        function updateDriverInfo() {
            if (!currentOrder) return;
            
            // 获取骑手信息
            const courierName = currentOrder.courierName || currentOrder.courier?.name || currentOrder.driverName || '张师傅';
            const courierPhone = currentOrder.courierPhone || currentOrder.courier?.phone || currentOrder.driverPhone || '138****1234';
            
            document.getElementById('driverName').textContent = courierName;
            document.getElementById('driverRating').textContent = '4.9分';
            document.getElementById('driverOrders').textContent = '已完成1288单';
        }
        
        // 更新配送UI
        function updateDeliveryUI() {
            const config = DELIVERY_STAGES[deliveryType];
            
            // 更新状态图标和标题
            const statusIcon = document.getElementById('statusIcon');
            statusIcon.className = `status-icon ${config.iconClass}`;
            statusIcon.innerHTML = `<i class="fas ${config.icon}"></i>`;
            
            // 根据当前阶段显示不同标题
            const stageConfig = config.steps.find(s => s.key === currentStage);
            if (stageConfig) {
                document.getElementById('statusTitle').textContent = stageConfig.title;
                document.getElementById('statusSubtitle').textContent = stageConfig.desc;
            } else {
                document.getElementById('statusTitle').textContent = config.title;
                document.getElementById('statusSubtitle').textContent = config.subtitle;
            }
            
            // 更新配送类型标签
            const typeEl = document.getElementById('deliveryType');
            if (deliveryType === 'pickup') {
                typeEl.innerHTML = '<i class="fas fa-arrow-up"></i> 送件到门店';
            } else {
                typeEl.innerHTML = '<i class="fas fa-arrow-down"></i> 送回用户';
            }
            
            // 更新地图地址
            if (deliveryType === 'return') {
                document.getElementById('startLocation').textContent = '门店地址';
                document.getElementById('startAddr').textContent = currentOrder?.store?.name || currentOrder?.storeName || '门店位置';
                document.getElementById('endLocation').textContent = '配送地址';
                document.getElementById('endAddr').textContent = currentOrder?.deliveryAddress || '用户地址';
            }
        }
        
        // 更新订单信息
        function updateOrderInfo() {
            if (!currentOrder) return;
            
            // 更新配送费
            const fee = currentOrder.deliveryFee || 15;
            document.getElementById('deliveryFee').textContent = `¥${fee.toFixed(2)}`;
            
            // 更新物品列表
            const items = currentOrder.items || currentOrder.services || [];
            const itemsHtml = items.map(item => `
                <div class="order-item">
                    <span class="order-item-name">${item.name || item.serviceName || '衣物'}</span>
                    <span class="order-item-count">x${item.quantity || 1}</span>
                </div>
            `).join('');
            document.getElementById('orderItems').innerHTML = itemsHtml;
        }
        
        // 更新时间线阶段
        function updateTimelineStage() {
            const config = DELIVERY_STAGES[deliveryType];
            const steps = config.steps;
            
            // 根据当前阶段确定已完成和活跃的步骤
            let currentIndex = 0;
            if (deliveryType === 'return' || deliveryType === 'pickup') {
                // 统一4步流程：商家待出库 → 骑手待取件 → 配送中 → 送达
                const stageOrder = ['awaiting_store_outbound', 'picking', 'delivering', 'delivered'];
                currentIndex = stageOrder.indexOf(currentStage);
                if (currentIndex < 0) currentIndex = 0;
            }
            
            // 更新主按钮状态
            const mainBtn = document.getElementById('mainAction');
            if (currentStage === 'delivered') {
                mainBtn.textContent = '确认收货';
                mainBtn.className = 'bottom-btn success';
            } else {
                mainBtn.textContent = '等待送达';
                mainBtn.className = 'bottom-btn primary';
                mainBtn.disabled = true;
            }
        }
        
        // 渲染时间线
        function renderTimeline() {
            const config = DELIVERY_STAGES[deliveryType];
            const timeline = document.getElementById('deliveryTimeline');
            
            // 确定当前进度
            const currentStepIndex = config.steps.findIndex(s => s.key === currentStage);
            
            timeline.innerHTML = config.steps.map((step, index) => {
                let statusClass = 'pending';
                if (index < currentStepIndex) statusClass = 'completed';
                else if (index === currentStepIndex) statusClass = 'active';
                
                return `
                    <div class="timeline-item ${statusClass}">
                        <div class="timeline-dot">
                            <i class="fas ${step.icon}"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-step-title">${step.title}</div>
                            <div class="timeline-step-desc">${step.desc}</div>
                            ${index <= currentStepIndex ? `<div class="timeline-time">${getStepTime(index, step.key)}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 获取步骤时间
        function getStepTime(stepIndex, stepKey) {
            if (!currentOrder) return '刚刚';
            
            // 根据实际时间戳显示
            if (stepKey === 'awaiting_store_outbound' && currentOrder.deliveryFeePaidAt) {
                return formatTime(currentOrder.deliveryFeePaidAt);
            }
            if (stepKey === 'picking' && currentOrder.courier?.assignedAt) {
                return formatTime(currentOrder.courier.assignedAt);
            }
            if (stepKey === 'delivered' && currentOrder.courier?.deliveredAt) {
                return formatTime(currentOrder.courier.deliveredAt);
            }
            
            const times = ['刚刚', '2分钟前', '5分钟前', '8分钟前', '10分钟前'];
            return times[stepIndex] || '刚刚';
        }
        
        // 格式化时间
        function formatTime(isoString) {
            if (!isoString) return '刚刚';
            const date = new Date(isoString);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return '刚刚';
            if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}小时前`;
            return date.toLocaleDateString('zh-CN');
        }
        
        // 实时更新：storage 事件（跨标签页） + 后端状态轮询
        function startRealtimeUpdate() {
            // 监听 localStorage 变化（跨标签页同步 — 仅更新 currentOrder 引用，不重置 stage）
            window.addEventListener('storage', (e) => {
                if (e.key === 'orders' || e.key === 'currentOrder') {
                    console.log('[配送跟踪] 跨标签页数据变更，同步 currentOrder 引用');
                    const orders = getUserOrders();
                    const order = orders.find(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
                    if (order) {
                        currentOrder = { ...currentOrder, ...order };
                        deliveryType = detectDeliveryType(currentOrder);
                        updateDriverInfo();
                        updateOrderInfo();
                        updateDeliveryUI();
                        renderTimeline();
                    }
                }
            });

            // 每 5 秒查询后端专用状态端点（轻量、不返回全量订单）
            setInterval(async () => {
                try {
                    const token = localStorage.getItem('userToken') || localStorage.getItem('authToken');
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    // 使用专用状态端点 GET /orders/:id/status，只返回 courier 状态
                    const resp = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/status`, {
                        headers,
                        signal: AbortSignal.timeout(3000)
                    });
                    if (!resp.ok) return;

                    const result = await resp.json();
                    const statusData = result.data || result;
                    if (!statusData) return;

                    // 从 status 端点提取 courier 状态（注意：status 端点可能不直接返回 courier）
                    // fallback：如果没有 courier 字段，用全量端点
                    const courierStatus = statusData.courier?.status
                        || statusData.courierStatus
                        || statusData.deliveryStatus;

                    const prevStage = currentStage;
                    if (courierStatus === 'awaiting_store_outbound') {
                        currentStage = 'awaiting_store_outbound';
                    } else if (courierStatus === 'picking') {
                        currentStage = 'picking';
                    } else if (courierStatus === 'delivering' || statusData.status === 'delivering_back') {
                        currentStage = 'delivering';
                    } else if (courierStatus === 'delivered' || statusData.status === 'completed') {
                        currentStage = 'delivered';
                    }
                    // courierStatus 未知 → 保持 currentStage 不变，避免闪烁

                    if (currentStage !== prevStage) {
                        console.log('[配送跟踪] 轮询检测到阶段变更:', prevStage, '→', currentStage);
                        updateDeliveryUI();
                        renderTimeline();
                        updateTimelineStage();
                        
                        // 送达后更新按钮
                        if (currentStage === 'delivered') {
                            const mainBtn = document.getElementById('mainAction');
                            if (mainBtn) {
                                mainBtn.textContent = '确认收货';
                                mainBtn.className = 'bottom-btn success';
                                mainBtn.disabled = false;
                            }
                        }
                    }
                } catch (e) {
                    // 网络错误静默忽略
                }
            }, 5000);
        }
        
        // 更新状态UI
        function updateStatusUI() {
            const config = DELIVERY_STAGES[deliveryType];
            const step = config.steps.find(s => s.key === currentStage);
            
            if (step) {
                document.getElementById('statusTitle').textContent = step.title;
                document.getElementById('statusSubtitle').textContent = step.desc;
            }
        }
        
        // 处理主操作
        function handleMainAction() {
            if (currentStage === 'delivered') {
                // 显示确认弹窗
                document.getElementById('confirmModal').classList.add('show');
            } else {
                alert('配送员还未送达，请耐心等待');
            }
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }
        
        // 确认收货
        async function confirmReceived() {
            closeModal();
            
            const now = new Date().toISOString();
            
            try {
                // 调用API确认收货
                const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/confirm-delivery`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
                    },
                    body: JSON.stringify({
                        confirmedAt: now,
                        deliveryType: deliveryType
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    console.log('[确认收货] API更新成功');
                }
            } catch (error) {
                console.log('[确认收货] API调用失败，使用本地处理:', error.message);
            }
            
            // 更新本地订单状态
            updateLocalOrderStatus('completed', now);
            
            alert('✓ 确认收货成功！\n\n感谢您的使用，欢迎下次光临！');
            
            // 跳转到订单列表
            window.location.href = 'c-orders.html';
        }
        
        // 更新本地订单状态
        function updateLocalOrderStatus(status, completedAt) {
            const orders = getUserOrders();
            const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            
            // 更新用户订单
            const idx = orders.findIndex(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
            if (idx > -1) {
                orders[idx].status = status;
                orders[idx].completedAt = completedAt || new Date().toISOString();
                orders[idx].courierStatus = 'completed';
                orders[idx].deliveryStatus = 'completed';
                setUserOrders(orders);
            }
            
            // 更新门店订单
            const storeIdx = storeOrders.findIndex(o => o.orderId === orderId || o.id === orderId || o._id === orderId);
            if (storeIdx > -1) {
                storeOrders[storeIdx].status = status;
                storeOrders[storeIdx].completedAt = completedAt || new Date().toISOString();
                storeOrders[storeIdx].courierStatus = 'completed';
                storeOrders[storeIdx].deliveryStatus = 'completed';
                localStorage.setItem('store_orders', JSON.stringify(storeOrders));
            }
            
            // 触发事件通知其他页面
            window.dispatchEvent(new CustomEvent('orderUpdated', { 
                detail: { orderId: orderId, status: status } 
            }));
        }
        
        // 刷新状态
        function refreshStatus() {
            const btn = document.querySelector('.bottom-btn.secondary');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中';
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新';
                renderTimeline();
                alert('状态已更新');
            }, 1000);
        }
        
        // 联系配送员
        function callDriver() {
            const phone = currentOrder?.courierPhone || currentOrder?.courier?.phone || currentOrder?.driverPhone || '138****1234';
            const name = currentOrder?.courierName || currentOrder?.courier?.name || currentOrder?.driverName || '配送员';
            
            if (confirm(`是否拨打${name}的电话：${phone}？`)) {
                // 实际应用中这里应该调用拨打电话API
                alert(`📞 拨号：${phone}`);
            }
        }
        
        // 消息配送员
        function messageDriver() {
            alert('发送消息功能开发中');
        }
        
        // 演示数据
        function showDemoData() {
            currentOrder = {
                orderId: orderId || 'demo123',
                status: 'delivering_back',
                outboundTime: new Date(Date.now() - 5 * 60 * 1000).toISOString(), // 5分钟前
                pickupAddress: '北京市朝阳区xxx小区',
                store: { name: '优衣库干洗店', address: '北京市朝阳区xxx街道' },
                storeName: '优衣库干洗店',
                deliveryAddress: '北京市朝阳区yyy小区',
                deliveryFee: 15,
                items: [
                    { name: '羽绒服', quantity: 1 },
                    { name: '运动鞋', quantity: 2 }
                ],
                courierName: '张师傅',
                courierPhone: '138****1234'
            };
            
            currentStage = 'picking';
            deliveryType = 'return';
            
            updateDriverInfo();
            updateDeliveryUI();
            updateOrderInfo();
            updateTimelineStage();
            renderTimeline();
        }
        
        // 检查登录
        if (!localStorage.getItem('userToken')) {
            window.location.href = 'c-login.html';
        } else {
            document.addEventListener('DOMContentLoaded', init);
        }
    </script>
