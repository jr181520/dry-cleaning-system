    // 扫码冷却期（30秒）- 防止轮询触发重复灯条请求
    const SCAN_COOLDOWN = 30000; // 30秒
    
    // 防抖变量：避免频繁更新UI
    let updatePending = false;
    let lastUpdateTime = 0;
    const UPDATE_DEBOUNCE = 1000; // 1秒防抖

    // 统一的状态更新函数（包含防抖逻辑）
    function scheduleUIUpdate(order) {
      if (updatePending) {
        console.log('[防抖] 跳过更新（锁定中）| 订单:', order?.orderNo || orderId);
        return;
      }
      
      updatePending = true;
      lastUpdateTime = Date.now();
      
      console.log('[防抖] 计划更新UI | 订单:', order?.orderNo || orderId, '| 状态:', order?.status);
      
      // 立即更新UI
      // 保留 courier 信息（避免 localStorage 数据覆盖掉跑腿轮询写入的骑手状态）
      if (!order.courier && currentOrder && currentOrder.courier) {
        order.courier = currentOrder.courier;
      }
      currentOrder = order;
      lastKnownOrderStatus = order.status;
      lastKnownUpdatedAt = order.updatedAt;
      updateOrderUI(currentOrder);
      
      // 更新页面标题
      document.title = `订单详情 - ${getStatusText(order.status)}`;
      
      // 订单完成 → 自动返回订单列表（配送流程走完后）
      if (order.status === 'completed' && !sessionStorage.getItem('_completedAutoNav_' + orderId)) {
        sessionStorage.setItem('_completedAutoNav_' + orderId, '1');
        showToast('✅ 订单已完成，即将返回订单列表', 'success');
        setTimeout(() => {
          console.log('[状态轮询] 订单已完成，自动返回订单列表');
          returnToOrders();
        }, 3000);
      }
      
      // 防抖锁定 1 秒
      setTimeout(() => {
        updatePending = false;
        console.log('[防抖] 解锁 | 上次更新时间:', lastUpdateTime);
      }, UPDATE_DEBOUNCE);
    }

    // 刷新订单数据（统一入口，整合防抖）
    async function refreshOrderData() {
      if (!orderId) return;
      
      // 防抖检查：如果上次更新时间在1秒内，跳过这次检查
      const now = Date.now();
      if (now - lastUpdateTime < UPDATE_DEBOUNCE) {
        console.log('[刷新] 跳过（防抖）| 当前:', now, '| 上次:', lastUpdateTime, '| 间隔:', now - lastUpdateTime, 'ms');
        return;
      }
      
      try {
        // 0. 扫码冷却期检查：在扫码后30秒内，跳过所有状态更新（使用订单隔离状态）
        const currentCooldownUntil = getCurrentCooldownUntil();
        if (Date.now() < currentCooldownUntil) {
          const remaining = Math.ceil((currentCooldownUntil - Date.now()) / 1000);
          console.log('[刷新] 跳过：扫码冷却期剩余', remaining, '秒 | 订单:', orderId);
          return;
        }
        
        // 1. 状态保护：如果订单已完成，拒绝任何状态回退
        if (lastKnownOrderStatus === 'completed') {
          console.log('[刷新] 已完成订单，跳过所有状态更新');
          return;
        }
        
        // 2. 状态保护：防止订单被错误回退到待支付
        // 如果当前状态不是 pending，不接受从 API/localStorage 返回的 pending 状态
        if (lastKnownOrderStatus && lastKnownOrderStatus !== 'pending') {
          // 检查 localStorage
          const ordersStr = localStorage.getItem(getUserOrdersKey());
          if (ordersStr) {
            const orders = JSON.parse(ordersStr);
            const order = orders.find(o => 
              o.orderId === orderId || o.id === orderId || o._id === orderId || o.orderNo === orderId
            );
            if (order && order.status === 'pending') {
              console.log('[刷新] 跳过：拒绝 pending 状态回退（当前:', lastKnownOrderStatus, '）');
              return;
            }
          }
        }
        
        // 3. 首先检查localStorage是否有更新（M端会实时更新这里）
        const ordersStr = localStorage.getItem(getUserOrdersKey());
        if (ordersStr) {
          const orders = JSON.parse(ordersStr);
          const order = orders.find(o => 
            o.orderId === orderId || 
            o.id === orderId || 
            o._id === orderId ||
            o.orderNo === orderId
          );
          
          if (order) {
            // 状态保护：已完成订单拒绝任何非completed状态
            if (order.status !== 'completed' && lastKnownOrderStatus === 'completed') {
              console.log('[刷新] 跳过：已完成订单拒绝状态变化为', order.status);
              return;
            }
            
            // 状态保护：已扫码订单拒绝 ready 状态（防止旧数据覆盖）- 使用订单隔离状态
            const isLocalReady = order.status === 'ready';
            if (getCurrentUserHasScanned() && isLocalReady) {
              console.log('[刷新] 跳过：用户已扫码，拒绝 ready 状态（旧数据）');
              return;
            }
            
            // ⚠️ 状态进阶守卫：localStorage 状态不得低于 API 已确认的状态
            //    防止 localStorage 的旧状态覆盖掉 API 返回的更高阶状态
            if (lastKnownOrderStatus && order.status !== lastKnownOrderStatus) {
              const localRank = getStatusRank(order.status);
              const knownRank = getStatusRank(lastKnownOrderStatus);
              if (localRank < knownRank) {
                console.log('[刷新] 拒绝状态回退: localStorage=', order.status, '(rank', localRank, ') < 已知=', lastKnownOrderStatus, '(rank', knownRank, ')');
                // 不 return，继续走 API 检查（可能 API 也变了）
              } else {
                // 状态前进或同等 → 正常处理
                const statusChanged = true;
                console.log('[刷新] localStorage状态前进:', lastKnownOrderStatus, '→', order.status);
                scheduleUIUpdate(order);
                return;
              }
            } else if (order.status === lastKnownOrderStatus) {
              // 相同状态：仅更新时间戳
              const localUpdatedAt = order.updatedAt ? new Date(order.updatedAt) : null;
              const currentUpdatedAt = lastKnownUpdatedAt ? new Date(lastKnownUpdatedAt) : null;
              const timeChanged = localUpdatedAt && currentUpdatedAt && localUpdatedAt > currentUpdatedAt;
              
              console.log('[刷新] localStorage状态:', order.status, '| 相同，timestamp变化:', timeChanged);
              
              if (timeChanged) {
                console.log('[刷新] 时间戳更新但状态未变，仅更新本地记录');
                currentOrder = order;
                lastKnownOrderStatus = order.status;
                lastKnownUpdatedAt = order.updatedAt;
                return;
              }
            }
          }
        }
        
        // 4. 如果localStorage没有明显更新，再从API获取
        const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/status`, {
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });
        const result = await response.json();
        
        if (result.success && result.data) {
          const apiOrder = result.data;
          
          // 状态保护：已完成订单拒绝任何状态
          if (lastKnownOrderStatus === 'completed') {
            console.log('[API刷新] 已完成订单，跳过API状态更新');
            return;
          }
          
          // 状态保护：拒绝 pending 状态
          if (lastKnownOrderStatus && lastKnownOrderStatus !== 'pending' && apiOrder.status === 'pending') {
            console.log('[API刷新] 跳过：拒绝 pending 状态回退');
            return;
          }
          
          // 状态保护：已扫码订单拒绝 ready 状态
          const isApiReady = apiOrder.status === 'ready';
          if (getCurrentUserHasScanned() && isApiReady) {
            console.log('[API刷新] 跳过：用户已扫码，拒绝 API 返回 ready 状态');
            return;
          }
          
          const apiStatusChanged = apiOrder.status !== lastKnownOrderStatus;
          
          console.log('[API刷新] API状态:', apiOrder.status, '| 上次:', lastKnownOrderStatus, '| 用户已扫码:', getCurrentUserHasScanned(), '| 变化:', apiStatusChanged);
          
          if (apiStatusChanged) {
            // API状态变化，使用统一更新函数
            scheduleUIUpdate(apiOrder);
            return;
          }
        }
        
        console.log('[刷新] 数据无变化，保持当前状态:', lastKnownOrderStatus);
      } catch (error) {
        console.log('[刷新] 获取失败，保留当前数据:', error.message);
      }
    }
    
    // 检查登录状态
    if (!localStorage.getItem('userToken')) {
        window.location.href = 'c-login.html';
    } else {
        document.addEventListener('DOMContentLoaded', init);
    }
  </script>
</body>
</html>
