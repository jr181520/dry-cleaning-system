<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据同步诊断工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-item { padding: 4px 8px; border-bottom: 1px solid #eee; }
        .log-item.info { background: #e3f2fd; }
        .log-item.success { background: #e8f5e9; }
        .log-item.error { background: #ffebee; }
        .log-item.warn { background: #fff3e0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">🔧 数据同步诊断工具</h1>
        
        <!-- 诊断控制面板 -->
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <h2 class="text-lg font-semibold mb-3">诊断控制</h2>
            <div class="flex flex-wrap gap-2">
                <button onclick="runFullDiagnosis()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    🔍 全面诊断
                </button>
                <button onclick="syncAllEndpoints()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                    🔄 同步所有端
                </button>
                <button onclick="clearAllCache()" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                    🗑️ 清除缓存
                </button>
                <button onclick="exportDiagnosis()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                    📥 导出报告
                </button>
            </div>
        </div>
        
        <!-- 三个端的状态 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <!-- C端 -->
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-bold text-blue-600 mb-2">👤 C端（用户端）</h3>
                <div class="text-sm space-y-1">
                    <div>Token: <span id="c-token" class="text-gray-500">检查中...</span></div>
                    <div>本地订单: <span id="c-orders-count" class="font-bold">-</span></div>
                    <div>最后更新: <span id="c-orders-time" class="text-gray-500">-</span></div>
                    <div>API订单: <span id="c-api-orders" class="font-bold">-</span></div>
                </div>
                <button onclick="syncEndpoint('c')" class="mt-2 w-full px-3 py-1 bg-blue-100 text-blue-600 rounded hover:bg-blue-200">
                    同步C端
                </button>
            </div>
            
            <!-- M端 -->
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-bold text-green-600 mb-2">🏪 M端（门店端）</h3>
                <div class="text-sm space-y-1">
                    <div>Token: <span id="m-token" class="text-gray-500">检查中...</span></div>
                    <div>本地订单: <span id="m-orders-count" class="font-bold">-</span></div>
                    <div>门店ID: <span id="m-store-id" class="text-gray-500">-</span></div>
                    <div>API订单: <span id="m-api-orders" class="font-bold">-</span></div>
                </div>
                <button onclick="syncEndpoint('m')" class="mt-2 w-full px-3 py-1 bg-green-100 text-green-600 rounded hover:bg-green-200">
                    同步M端
                </button>
            </div>
            
            <!-- Admin端 -->
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-bold text-purple-600 mb-2">⚙️ 管理端</h3>
                <div class="text-sm space-y-1">
                    <div>Token: <span id="admin-token" class="text-gray-500">检查中...</span></div>
                    <div>本地订单: <span id="admin-orders-count" class="font-bold">-</span></div>
                    <div>全部订单: <span id="admin-api-orders" class="font-bold">-</span></div>
                </div>
                <button onclick="syncEndpoint('admin')" class="mt-2 w-full px-3 py-1 bg-purple-100 text-purple-600 rounded hover:bg-purple-200">
                    同步Admin
                </button>
            </div>
        </div>
        
        <!-- 服务器状态 -->
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <h2 class="text-lg font-semibold mb-3">🖥️ 服务器状态</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="text-center">
                    <div class="text-3xl font-bold" id="server-total-orders">-</div>
                    <div class="text-sm text-gray-500">总订单数</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-yellow-600" id="server-pending-orders">-</div>
                    <div class="text-sm text-gray-500">待支付</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-blue-600" id="server-paid-orders">-</div>
                    <div class="text-sm text-gray-500">已支付</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-green-600" id="server-completed-orders">-</div>
                    <div class="text-sm text-gray-500">已完成</div>
                </div>
            </div>
        </div>
        
        <!-- 诊断日志 -->
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-3">📋 诊断日志</h2>
            <div id="log-container" class="log-container bg-gray-50 rounded border">
                <div class="log-item info">等待诊断...</div>
            </div>
        </div>
        
        <!-- 问题诊断结果 -->
        <div class="bg-white rounded-lg shadow p-4 mt-4">
            <h2 class="text-lg font-semibold mb-3">🔎 问题诊断</h2>
            <div id="diagnosis-results" class="space-y-2">
                <div class="text-gray-500">点击"全面诊断"开始检查...</div>
            </div>
        </div>
    </div>
    
    <!-- 引入统一同步模块 -->
    <script src="js/unified-sync.js"></script>
    
    <script>
        const API_BASE = 'http://localhost:3000/api';
        
        // 端点配置
        const endpoints = {
            c: {
                storageKey: 'c_orders',
                tokenKeys: ['userToken', 'authToken'],
                name: 'C端'
            },
            m: {
                storageKey: 'm_orders',
                tokenKeys: ['storeToken', 'authToken'],
                name: 'M端'
            },
            admin: {
                storageKey: 'admin_orders',
                tokenKeys: ['adminToken', 'adminAuthToken'],
                name: 'Admin'
            }
        };
        
        // 添加日志
        function addLog(message, type = 'info') {
            const container = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.innerHTML = `<span class="text-gray-400">[${time}]</span> ${message}`;
            container.insertBefore(div, container.firstChild);
        }
        
        // 获取token
        function getToken(endpoint) {
            const keys = endpoints[endpoint].tokenKeys;
            for (const key of keys) {
                const token = localStorage.getItem(key);
                if (token) return { key, token: token.substring(0, 20) + '...' };
            }
            return null;
        }
        
        // 获取本地订单数
        function getLocalOrdersCount(endpoint) {
            const key = endpoints[endpoint].storageKey;
            try {
                const orders = JSON.parse(localStorage.getItem(key) || '[]');
                return orders.length;
            } catch {
                return 0;
            }
        }
        
        // 从API获取订单数
        async function getAPIOrdersCount(endpoint) {
            const tokenData = getToken(endpoint);
            if (!tokenData) return { count: 0, error: '未登录' };
            
            try {
                const response = await fetch(`${API_BASE}/cleaning/orders`, {
                    headers: { 'Authorization': `Bearer ${tokenData.token}` }
                });
                
                if (response.status === 401) {
                    return { count: 0, error: '认证失败' };
                }
                
                const result = await response.json();
                if (result.success) {
                    return { count: result.data?.list?.length || result.data?.length || 0 };
                }
                return { count: 0, error: result.error };
            } catch (e) {
                return { count: 0, error: '连接失败' };
            }
        }
        
        // 更新UI状态
        function updateUI(endpoint, data) {
            document.getElementById(`${endpoint}-token`).textContent = 
                data.token ? `✓ ${data.token.key}` : '✗ 未登录';
            document.getElementById(`${endpoint}-token`).className = 
                data.token ? 'text-green-600' : 'text-red-500';
            
            document.getElementById(`${endpoint}-orders-count`).textContent = 
                data.localCount !== undefined ? data.localCount : '-';
            
            if (endpoint === 'm') {
                const storeId = localStorage.getItem('currentStore') || localStorage.getItem('storeUser');
                if (storeId) {
                    try {
                        const store = JSON.parse(storeId);
                        document.getElementById('m-store-id').textContent = store.storeId || 'ST002';
                    } catch {}
                }
            }
        }
        
        // 同步单个端
        async function syncEndpoint(endpoint) {
            addLog(`开始同步 ${endpoints[endpoint].name}...`, 'info');
            
            const tokenData = getToken(endpoint);
            if (!tokenData) {
                addLog(`${endpoints[endpoint].name} 未登录，跳过`, 'warn');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/cleaning/orders`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem(tokenData.key)}` }
                });
                
                if (!response.ok) {
                    addLog(`${endpoints[endpoint].name} API错误: ${response.status}`, 'error');
                    return;
                }
                
                const result = await response.json();
                if (result.success) {
                    const orders = result.data?.list || result.data || [];
                    
                    // 保存到本地
                    localStorage.setItem(endpoints[endpoint].storageKey, JSON.stringify(orders));
                    
                    addLog(`${endpoints[endpoint].name} 同步成功，获取 ${orders.length} 条订单`, 'success');
                    
                    // 更新显示
                    updateUI(endpoint, { 
                        token: tokenData,
                        localCount: orders.length 
                    });
                }
            } catch (e) {
                addLog(`${endpoints[endpoint].name} 同步失败: ${e.message}`, 'error');
            }
        }
        
        // 同步所有端
        async function syncAllEndpoints() {
            addLog('开始同步所有端...', 'info');
            for (const endpoint of ['c', 'm', 'admin']) {
                await syncEndpoint(endpoint);
            }
            addLog('全部端同步完成', 'success');
        }
        
        // 清除所有缓存
        function clearAllCache() {
            const keys = ['c_orders', 'm_orders', 'admin_orders', 
                         'c_orders_backup', 'm_orders_backup', 'admin_orders_backup',
                         'orders', 'orders_backup', 'store_orders'];
            keys.forEach(key => localStorage.removeItem(key));
            addLog(`已清除 ${keys.length} 个缓存`, 'success');
            runFullDiagnosis();
        }
        
        // 获取服务器统计
        async function getServerStats() {
            const tokenData = getToken('admin') || getToken('c');
            if (!tokenData) {
                addLog('无有效Token，无法获取服务器统计', 'warn');
                return;
            }
            
            const key = tokenData.key;
            try {
                const response = await fetch(`${API_BASE}/cleaning/orders`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem(key)}` }
                });
                
                if (!response.ok) return;
                
                const result = await response.json();
                if (result.success) {
                    const orders = result.data?.list || result.data || [];
                    
                    document.getElementById('server-total-orders').textContent = orders.length;
                    document.getElementById('server-pending-orders').textContent = 
                        orders.filter(o => o.status === 'pending').length;
                    document.getElementById('server-paid-orders').textContent = 
                        orders.filter(o => o.status === 'paid').length;
                    document.getElementById('server-completed-orders').textContent = 
                        orders.filter(o => ['completed', 'cleaned', 'ready'].includes(o.status)).length;
                    
                    return orders;
                }
            } catch (e) {
                addLog('获取服务器统计失败', 'error');
            }
        }
        
        // 诊断问题
        function diagnoseProblems(data) {
            const results = [];
            
            // 检查1: Token状态
            const tokenIssues = [];
            for (const [ep, cfg] of Object.entries(endpoints)) {
                if (!getToken(ep)) {
                    tokenIssues.push(cfg.name);
                }
            }
            if (tokenIssues.length > 0) {
                results.push({
                    type: 'error',
                    message: `未登录: ${tokenIssues.join(', ')}`
                });
            }
            
            // 检查2: 数据一致性
            const consistencyIssues = [];
            for (const [ep, cfg] of Object.entries(endpoints)) {
                const local = getLocalOrdersCount(ep);
                const api = data.apiCounts[ep]?.count || 0;
                if (local !== api && api > 0) {
                    consistencyIssues.push(`${cfg.name}(本地${local} vs 服务器${api})`);
                }
            }
            if (consistencyIssues.length > 0) {
                results.push({
                    type: 'warn',
                    message: `数据不一致: ${consistencyIssues.join(', ')}`
                });
            }
            
            // 检查3: 连接状态
            if (!data.serverConnected) {
                results.push({
                    type: 'error',
                    message: '无法连接到后端服务器'
                });
            }
            
            // 显示结果
            const container = document.getElementById('diagnosis-results');
            container.innerHTML = '';
            
            if (results.length === 0) {
                container.innerHTML = '<div class="text-green-600">✓ 所有检查通过，未发现问题</div>';
            } else {
                results.forEach(r => {
                    const div = document.createElement('div');
                    div.className = `p-2 rounded ${r.type === 'error' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`;
                    div.textContent = r.type === 'error' ? '❌ ' + r.message : '⚠️ ' + r.message;
                    container.appendChild(div);
                });
            }
        }
        
        // 全面诊断
        async function runFullDiagnosis() {
            addLog('开始全面诊断...', 'info');
            
            const data = {
                apiCounts: {},
                serverConnected: false
            };
            
            // 1. 检查每个端的Token和本地数据
            for (const [ep, cfg] of Object.entries(endpoints)) {
                const token = getToken(ep);
                const localCount = getLocalOrdersCount(ep);
                updateUI(ep, { token, localCount });
                addLog(`${cfg.name}: Token=${token ? '✓' : '✗'}, 本地=${localCount}`, token ? 'success' : 'warn');
            }
            
            // 2. 获取API订单数
            for (const [ep, cfg] of Object.entries(endpoints)) {
                const result = await getAPIOrdersCount(ep);
                data.apiCounts[ep] = result;
                document.getElementById(`${ep}-api-orders`).textContent = 
                    result.count !== undefined ? result.count : result.error;
                addLog(`${cfg.name} API: ${result.count !== undefined ? result.count + '条' : result.error}`);
            }
            
            // 3. 获取服务器统计
            data.serverConnected = await getServerStats() !== undefined;
            if (data.serverConnected) {
                addLog('服务器连接正常', 'success');
            } else {
                addLog('服务器连接失败', 'error');
            }
            
            // 4. 诊断问题
            diagnoseProblems(data);
            
            addLog('诊断完成', 'success');
        }
        
        // 导出诊断报告
        function exportDiagnosis() {
            const report = {
                time: new Date().toISOString(),
                endpoints: {},
                serverStats: {
                    total: document.getElementById('server-total-orders').textContent,
                    pending: document.getElementById('server-pending-orders').textContent,
                    paid: document.getElementById('server-paid-orders').textContent,
                    completed: document.getElementById('server-completed-orders').textContent
                }
            };
            
            for (const [ep, cfg] of Object.entries(endpoints)) {
                report.endpoints[cfg.name] = {
                    loggedIn: !!getToken(ep),
                    localOrders: getLocalOrdersCount(ep),
                    apiOrders: document.getElementById(`${ep}-api-orders`).textContent
                };
            }
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diagnosis-${Date.now()}.json`;
            a.click();
            
            addLog('诊断报告已导出', 'success');
        }
        
        // 页面加载时自动诊断
        window.onload = () => {
            setTimeout(runFullDiagnosis, 500);
        };
    </script>
</body>
</html>
