<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的订单 - 干洗服务</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Leaflet Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 数据同步模块 -->
    <script src="js/order-sync.js"></script>
    <!-- 统一数据同步模块 -->
    <script src="js/unified-sync.js"></script>
    <!-- 用户数据隔离模块 -->
    <script src="js/user-data-isolation.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc',
                        info: '#3b82f6',
                        purple: '#8b5cf6',
                        pink: '#ec4899',
                        teal: '#14b8a6',
                        orange: '#f97316'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 标签栏 */
        .tab-bar {
            display: flex;
            background: #ffffff;
            border-bottom: 1rpx solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 24rpx 0;
            position: relative;
            transition: all 0.3s;
        }
        
        .tab-item.active {
            color: #1e40af;
        }
        
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 48rpx;
            height: 6rpx;
            background: #1e40af;
            border-radius: 3rpx;
        }
        
        /* 订单卡片 */
        .order-card {
            background: #ffffff;
            border-radius: 20rpx;
            padding: 24rpx;
            box-shadow: 0 4rpx 16rpx rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .order-card:active {
            transform: scale(0.99);
            background: #f9fafb;
        }
        
        /* 状态标签 */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6rpx;
            padding: 8rpx 16rpx;
            border-radius: 12rpx;
            font-size: 22rpx;
            font-weight: 600;
        }
        
        .status-tag.pending {
            background: #fef3c7;
            color: #d97706;
        }
        
        .status-tag.paid {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .status-tag.processing {
            background: #e0e7ff;
            color: #4338ca;
        }
        
        .status-tag.ready {
            background: #dcfce7;
            color: #10b981;
        }
        
        .status-tag.completed {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .status-tag.cancelled {
            background: #fee2e2;
            color: #ef4444;
        }
        
        /* 服务标签 */
        .service-tag {
            display: inline-flex;
            align-items: center;
            gap: 4rpx;
            background: #f3f4f6;
            padding: 6rpx 12rpx;
            border-radius: 8rpx;
            font-size: 20rpx;
        }
        
        /* 底部导航 */
        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            box-shadow: 0 -4rpx 20rpx rgba(0, 0, 0, 0.08);
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .tab-icon {
            width: 48rpx;
            height: 48rpx;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4rpx;
        }
        
        .tab-icon.active {
            background: #eff6ff;
            color: #1e40af;
        }
        
        /* 增强按钮样式 */
        .order-card button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .order-card button:active {
            transform: translateY(0);
            box-shadow: none;
        }
        
        /* 删除按钮悬停效果 */
        .delete-btn:hover {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #dc2626 !important;
        }
        
        /* 再次下单按钮增强效果 */
        .reorder-btn:hover {
            background: linear-gradient(to right, #2563eb, #4f46e5) !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4) !important;
        }
        
        /* 待取件状态特殊强调 */
        .pickup-section-highlight {
            animation: pulse-bg 2s infinite;
        }
        
        @keyframes pulse-bg {
            0%, 100% {
                background-color: #fef3c7;
            }
            50% {
                background-color: #fde68a;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">
    <!-- 顶部导航 -->
    <header class="bg-white sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100">
            <a href="c-index.html" class="text-gray-700">
                <i class="fa fa-arrow-left text-lg"></i>
            </a>
            <span class="text-lg font-semibold text-gray-800">我的订单</span>
            <span class="w-8"></span>
        </div>
        
        <!-- 标签栏 -->
        <div class="tab-bar">

            <div class="tab-item" onclick="switchTab('processing', event)">
                <span class="text-sm font-medium">处理中</span>
            </div>
            <div class="tab-item" onclick="switchTab('ready', event)">
                <span class="text-sm font-medium">待取件</span>
            </div>
        </div>
    </header>

    <!-- 订单列表 -->
    <main class="px-4 py-4">
        <div id="orders-list" class="space-y-4">
            <!-- 订单将通过JavaScript加载 -->
        </div>
        
        <!-- 空状态 -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-6xl mb-4">📋</div>
            <p class="text-gray-500 mb-4">暂无相关订单</p>
            <a href="c-order.html" class="inline-block px-6 py-3 bg-primary text-white rounded-full font-medium">
                立即下单
            </a>
        </div>
    </main>

    <!-- 底部TabBar -->
    <div class="bottom-tab-bar">
        <div class="flex justify-around items-center py-3">
            <div class="flex flex-col items-center gap-1 text-gray-500" onclick="goToPage('c-index.html')">
                <div class="tab-icon">
                    <i class="fa fa-home text-lg"></i>
                </div>
                <span class="text-xs">首页</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-gray-500" onclick="goToPage('c-order.html')">
                <div class="tab-icon">
                    <i class="fa fa-plus-circle text-lg"></i>
                </div>
                <span class="text-xs">下单</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-primary" onclick="goToPage('c-orders.html')">
                <div class="tab-icon active">
                    <i class="fa fa-shopping-bag text-lg"></i>
                </div>
                <span class="text-xs">订单</span>
            </div>
            <div class="flex flex-col items-center gap-1 text-gray-500" onclick="goToPage('c-profile.html')">
                <div class="tab-icon">
                    <i class="fa fa-user text-lg"></i>
                </div>
                <span class="text-xs">我的</span>
            </div>
        </div>
    </div>

    <!-- 跑腿配送地址弹窗 -->
    <div id="deliveryAddrModal" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:white; border-radius:16px; padding:24px; width:90%; max-width:400px; margin:auto; margin-top:20vh;">
            <h3 style="font-size:16px; font-weight:600; margin-bottom:16px;">🚚 填写配送地址</h3>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">配送地址</label>
                <input id="modalAddr" type="text" placeholder="如：XX小区X栋X单元" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">联系人</label>
                <input id="modalContact" type="text" placeholder="收件人姓名" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">联系电话</label>
                <input id="modalPhone" type="tel" placeholder="手机号码" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px;">
            </div>
            <div style="display:flex; gap:12px;">
                <button onclick="closeDeliveryAddrModal()" style="flex:1; padding:12px; background:#f3f4f6; border:none; border-radius:10px; font-size:14px; cursor:pointer;">取消</button>
                <button onclick="confirmDeliveryAddr()" style="flex:1; padding:12px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;">确认并选择服务商</button>
            </div>
        </div>
    </div>

    <script>
        // 当前标签
        let currentTab = 'all';
        
        // 品类化状态标签映射
        const CATEGORY_STATUS_LABELS = {
            cleaning:           { paid:'待入库', received:'已入库', cleaning:'清洗中', cleaned:'清洗完成', ready:'待取件', processing:'清洗中' },
            shoe_care:          { paid:'待入库', received:'已入库', cleaning:'清洗中', cleaned:'清洗完成', ready:'待取件', processing:'清洗中' },
            luxury_care:        { paid:'待收件', received:'已收件', cleaning:'养护中', cleaned:'养护完成', ready:'待取件', processing:'养护中' },
            pet_grooming:       { paid:'待接宠', received:'已接宠', cleaning:'洗护中', cleaned:'洗护完成', ready:'待接回', processing:'洗护中' },
            electronics_repair: { paid:'待收件', received:'已收件', cleaning:'维修中', cleaned:'维修完成', ready:'待取件', processing:'维修中' }
        };
        
        function getCategoryStatusText(status, categoryId) {
            const catLabels = CATEGORY_STATUS_LABELS[categoryId];
            if (catLabels && catLabels[status]) return catLabels[status];
            return statusMap[status]?.text || status;
        }

        // 状态映射（兼容后端状态值）
        const statusMap = {
            'pending': { text: '待支付', class: 'pending', icon: '⏳' },
            'paid': { text: '待入库', class: 'paid', icon: '📦' },
            'received': { text: '已入库', class: 'paid', icon: '📥' },
            'awaiting_store_confirm': { text: '待门店确认', class: 'pending', icon: '📋' },
            'store_confirmed': { text: '门店已确认', class: 'paid', icon: '✓' },
            'confirmed': { text: '已确认', class: 'paid', icon: '✓' },
            'processing': { text: '清洗中', class: 'processing', icon: '🧺' },
            'in_progress': { text: '清洗中', class: 'processing', icon: '🧺' },
            'cleaning': { text: '清洗中', class: 'processing', icon: '🧺' },
            'cleaned': { text: '清洗完成', class: 'processing', icon: '✨' },
            'ready': { text: '待取件', class: 'ready', icon: '📦' },
            'store_outbound': { text: '已出库', class: 'ready', icon: '📤' },
            'delivered': { text: '已送达', class: 'ready', icon: '✓' },
            'completed': { text: '已完成', class: 'completed', icon: '⭐' },
            'cancelled': { text: '已取消', class: 'cancelled', icon: '✕' }
        };

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态（支持 userToken 或 authToken）
            const hasUserToken = localStorage.getItem('userToken');
            const hasAuthToken = localStorage.getItem('authToken');
            if (!hasUserToken && !hasAuthToken) {
                console.warn('未登录，跳转到登录页');
                window.location.href = 'c-login.html';
                return;
            }
            console.log('用户已登录，userToken:', !!hasUserToken, 'authToken:', !!hasAuthToken);
            
            // ⚠️ 轮询同步已禁用 — 页面加载时直接拉取订单，pageshow 事件处理返回刷新
            // 如需启用轮询，取消下行注释：UnifiedSync.start();
            
            loadOrders();
            
            // 监听同步完成事件
            window.addEventListener('ordersSynced', (e) => {
                console.log('订单已同步，刷新列表...');
                loadOrders();
            });
            
            // 监听订单更新事件（从详情页返回时）
            window.addEventListener('orderUpdated', (e) => {
                console.log('订单已更新，刷新列表...', e.detail);
                loadOrders();
            });
            
            // 监听页面返回（pageshow 事件在浏览器返回时触发）
            window.addEventListener('pageshow', (e) => {
                console.log('页面显示，强制刷新订单列表...');
                loadOrders();
                if (OrderSyncManager) {
                    OrderSyncManager.sync();
                }
            });
            
            // 检查是否刚从详情页返回（通过 sessionStorage）
            if (sessionStorage.getItem('fromOrderDetail') === 'true') {
                console.log('刚从详情页返回，刷新订单列表...');
                sessionStorage.removeItem('fromOrderDetail');
                loadOrders();
                if (OrderSyncManager) {
                    OrderSyncManager.sync();
                }
            }
            
            // 监听M端的出库完成通知
            window.addEventListener('pickupCompleted', (e) => {
                console.log('[C端] 收到M端出库完成通知，刷新订单列表...', e.detail);
                loadOrders();
                if (OrderSyncManager) {
                    OrderSyncManager.sync();
                }
            });
            
            // 监听localStorage变化（M端和C端跨标签页通信 + 跑腿状态同步）
            window.addEventListener('storage', (e) => {
                if (e.key === 'c_pickup_update') {
                    console.log('[C端] 检测到localStorage变化，刷新订单列表...');
                    const update = JSON.parse(e.newValue || '{}');
                    if (update.type === 'pickup_completed') {
                        loadOrders();
                        if (OrderSyncManager) {
                            OrderSyncManager.sync();
                        }
                    }
                }
                // 跑腿轮询同步：当详情页更新orders或store_orders时，列表页自动刷新
                if (e.key === 'orders' || e.key === 'store_orders') {
                    console.log('[C端] 检测到订单数据变化（', e.key, '），自动刷新列表');
                    loadOrders();
                }
            });
            
            // 定期检查订单更新（每5秒）
            setInterval(() => {
                const latestUpdate = localStorage.getItem('c_pickup_update');
                if (latestUpdate) {
                    const update = JSON.parse(latestUpdate);
                    if (Date.now() - update.timestamp < 10000) { // 10秒内的更新
                        console.log('[C端] 检测到最近更新，刷新订单列表...');
                        loadOrders();
                        if (OrderSyncManager) {
                            OrderSyncManager.sync();
                        }
                    }
                }
            }, 5000);
            
            // 检查是否刚从支付页返回（通过 sessionStorage）
            if (sessionStorage.getItem('fromPaymentPage') === 'true') {
                console.log('刚从支付页返回，刷新订单列表...');
                sessionStorage.removeItem('fromPaymentPage');
                loadOrders();
                if (OrderSyncManager) {
                    OrderSyncManager.sync();
                }
            }
            
            // 使用事件委托绑定取件按钮事件
            const ordersList = document.getElementById('orders-list');
            if (ordersList) {
                ordersList.addEventListener('click', function(e) {
                    const target = e.target;
                    
                    // 到店自提按钮
                    if (target.classList.contains('pickup-btn-store') || target.closest('.pickup-btn-store')) {
                        e.stopPropagation();
                        const btn = target.classList.contains('pickup-btn-store') ? target : target.closest('.pickup-btn-store');
                        const orderId = btn.dataset.orderId;
                        selectPickupMethod(orderId, 'store_pickup');
                        return;
                    }
                    
                    // 跑腿配送按钮
                    if (target.classList.contains('pickup-btn-delivery') || target.closest('.pickup-btn-delivery')) {
                        e.stopPropagation();
                        const btn = target.classList.contains('pickup-btn-delivery') ? target : target.closest('.pickup-btn-delivery');
                        const orderId = btn.dataset.orderId;
                        selectPickupMethod(orderId, 'home_delivery');
                        return;
                    }
                    

                });
            }
        });

        // 切换标签
        function switchTab(tab, event) {
            currentTab = tab;
            
            // 更新UI
            document.querySelectorAll('.tab-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            loadOrders();
        }

                // 从后端加载订单列表
        async function loadOrdersFromAPI() {
            try {
                // 优先使用统一同步模块的数据
                if (UnifiedSync && UnifiedSync.config.isEnabled) {
                    console.log('[c-orders] 使用统一同步数据...');
                    const syncData = UnifiedSync.getLocalOrders();
                    if (syncData.orders.length > 0) {
                        console.log('[c-orders] 统一同步返回订单:', syncData.orders.length);
                        return syncData.orders;
                    }
                }
                
                // 获取用户ID（优先使用openid，兼容guest模式）
                const openid = localStorage.getItem('userOpenid');
                const userId = openid || localStorage.getItem('userId');
                const token = localStorage.getItem('userToken') || localStorage.getItem('authToken') || '';
                
                console.log('[c-orders] 加载订单', { userId, openid, hasToken: !!token, idType: openid ? 'openid' : 'guest' });
                
                // 构建API URL，包含userId参数
                let apiUrl = 'http://localhost:3000/api/cleaning/orders';
                if (userId) {
                    apiUrl += `?userId=${encodeURIComponent(userId)}`;
                }
                
                const response = await fetch(apiUrl, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                console.log('[c-orders] API响应状态:', response.status);
                const result = await response.json();
                console.log('[c-orders] API返回结果:', result);
                
                if (result.success && result.data) {
                    const serverOrders = result.data.list || [];
                    const mappedOrders = serverOrders.map(serverOrder => ({
                        orderId: serverOrder.orderNo,
                        id: serverOrder._id,
                        _id: serverOrder._id,
                        orderNo: serverOrder.orderNo,
                        items: serverOrder.items || [],
                        services: serverOrder.items ? serverOrder.items.map(item => ({
                            name: item.name,
                            icon: '📦',
                            price: item.price
                        })) : [],
                        store: serverOrder.store ? {
                            id: serverOrder.storeId,
                            name: serverOrder.store.name || serverOrder.storeName || '服务网点',
                            address: serverOrder.store.address || serverOrder.storeAddress || '',
                            phone: serverOrder.store.phone || '',
                            city: serverOrder.store.city || '',
                            district: serverOrder.store.district || '',
                            location: serverOrder.store.location || null,
                            specialty: serverOrder.store.specialty || ''
                        } : {
                            id: serverOrder.storeId,
                            name: serverOrder.storeName || '服务网点',
                            address: serverOrder.storeAddress || '',
                            location: null
                        },
                        storeId: serverOrder.storeId,
                        storeName: serverOrder.storeName || serverOrder.store?.name || '',
                        storeAddress: serverOrder.storeAddress || serverOrder.store?.address || '',
                        status: serverOrder.status,
                        deliveryStatus: serverOrder.status,
                        fees: {
                            total: serverOrder.amounts?.total || 0,
                            serviceFee: serverOrder.amounts?.subtotal || 0,
                            deliveryFee: serverOrder.amounts?.deliveryFee || 0,
                            discount: serverOrder.amounts?.discount || 0
                        },
                        createTime: new Date(serverOrder.createdAt).toLocaleString(),
                        createdAt: serverOrder.createdAt,
                        contact: serverOrder.delivery ? {
                            name: serverOrder.delivery.contactName,
                            phone: serverOrder.delivery.contactPhone,
                            address: serverOrder.delivery.address
                        } : {}
                    }));
                    
                    // 【数据隔离】同步到用户隔离的备份
                    setUserOrdersBackup(mappedOrders);
                    
                    return mappedOrders;
                }
                return [];
            } catch (error) {
                console.error('从API加载订单失败:', error);
                return null;
            }
        }

        // 加载订单列表
        async function loadOrders() {
            const ordersList = document.getElementById('orders-list');
            const emptyState = document.getElementById('empty-state');
            
            // 【数据隔离】从用户隔离的 key 加载
            let localOrders = getUserOrders();
            
            // 尝试从API加载订单
            let apiOrders = await loadOrdersFromAPI();
            
            // 如果API失败，使用localStorage备份数据
            if (!apiOrders || apiOrders.length === 0) {
                const backupOrders = getUserOrdersBackup();
                if (backupOrders.length > 0) {
                    console.log('API获取失败，使用localStorage备份数据，共', backupOrders.length, '条订单');
                    apiOrders = backupOrders;
                    
                    // 显示提示
                    const backupTime = getUserOrdersBackupTime();
                    if (backupTime) {
                        const backupDate = new Date(backupTime).toLocaleString();
                        console.log('数据备份时间:', backupDate);
                    }
                }
            }
            
            // 合并订单：API订单 + 本地订单（去重，优先使用本地更新的订单）
            let orders = [];
            
            console.log('[c-orders] localOrders数量:', localOrders.length);
            console.log('[c-orders] apiOrders数量:', apiOrders ? apiOrders.length : 0);
            
            // 将本地订单合并到列表中（优先使用本地订单，因为本地可能有最新状态更新）
            localOrders.forEach(localOrder => {
                orders.push(localOrder);
            });
            
            // 将API订单合并到列表中（如果本地没有则添加）
            if (apiOrders && apiOrders.length > 0) {
                apiOrders.forEach(apiOrder => {
                    // 支持多种ID格式匹配
                    const localIndex = orders.findIndex(o => 
                        o.orderId === apiOrder.orderId || 
                        o.id === apiOrder.orderId ||
                        o._id === apiOrder.orderId ||
                        o.orderNo === apiOrder.orderId
                    );
                    if (localIndex === -1) {
                        // 本地没有，添加API订单
                        orders.push(apiOrder);
                    } else {
                        // 本地已有订单，检查是否需要更新fees字段和items数据
                        const localOrder = orders[localIndex];
                        // 如果本地订单缺少fees字段或fees.total为0，但API订单有，则更新
                        const apiHasAmounts = apiOrder.fees?.total > 0 || apiOrder.amounts?.total > 0;
                        const localHasAmounts = localOrder.fees?.total > 0 || localOrder.amounts?.total > 0;
                        
                        if (!localHasAmounts && apiHasAmounts) {
                            // 本地没有金额但API有，更新金额
                            orders[localIndex] = { 
                                ...localOrder, 
                                fees: apiOrder.fees || localOrder.fees,
                                amounts: apiOrder.amounts || localOrder.amounts,
                                total: apiOrder.fees?.total || apiOrder.amounts?.total || localOrder.total || 0,
                                amount: apiOrder.fees?.total || apiOrder.amounts?.total || localOrder.amount || 0,
                                items: apiOrder.items || localOrder.items,
                                services: apiOrder.services || localOrder.services
                            };
                            console.log('[c-orders] 更新订单金额:', apiOrder.orderId, 'fees.total:', apiOrder.fees?.total || apiOrder.amounts?.total);
                        } else if (apiHasAmounts) {
                            // API和本地都有金额，保留较大的那个
                            const apiTotal = apiOrder.fees?.total || apiOrder.amounts?.total || 0;
                            const localTotal = localOrder.fees?.total || localOrder.amounts?.total || 0;
                            if (apiTotal > localTotal) {
                                orders[localIndex] = { 
                                    ...localOrder, 
                                    fees: apiOrder.fees || localOrder.fees,
                                    amounts: apiOrder.amounts || localOrder.amounts,
                                    total: apiTotal,
                                    amount: apiTotal,
                                    items: apiOrder.items || localOrder.items,

            console.log('[c-orders] 合并后订单数量:', orders.length, '当前Tab:', currentTab);
            
            // 过滤掉已删除的订单

            // 筛选订单（兼容后端状态值 + 所有本地中间状态 + 配送状态）

            if (currentTab === 'pending') {
                filteredOrders = orders.filter(o => o.status === 'pending' || o.status === 'paid');
            } else if (currentTab === 'processing') {
                filteredOrders = orders.filter(o => ['paid', 'confirmed', 'received', 'processing', 'cleaning', 'cleaned', 'in_progress', 'delivering', 'delivering_back', 'store_outbound', 'outbound', 'awaiting_store_outbound', 'awaiting_pickup_scan'].includes(o.status));
            } else if (currentTab === 'ready') {
                filteredOrders = orders.filter(o => o.status === 'ready');
            } else if (currentTab === 'completed') {
                filteredOrders = orders.filter(o => ['completed', 'delivered'].includes(o.status));
            } else if (currentTab === 'cancelled') {
                filteredOrders = orders.filter(o => o.status === 'cancelled');
            }
            
            // 【修复】完整的已知状态列表，确保任何状态订单都能在对应tab中可见

                // 未知状态订单合并到当前列表

            // 按创建时间倒序排列（最新的在前）

            console.log('[c-orders] 过滤后订单数量:', filteredOrders.length, '订单状态分布:', orders.map(o => o.status).join(', '));

                                    ${order.store?.address ? `<div class="text-xs text-gray-400">📍 ${order.store.address}</div>` : ''}
                                    ${order.store?.location?.coordinates ? `
                                        <button onclick="event.stopPropagation(); showStoreMap('${order.storeId}', '${order.store?.name || order.storeName}', '${order.store?.address || order.storeAddress}', ${Array.isArray(order.store.location.coordinates) ? order.store.location.coordinates[0] : order.store.location.coordinates.split(' ')[0]}, ${Array.isArray(order.store.location.coordinates) ? order.store.location.coordinates[1] : order.store.location.coordinates.split(' ')[1]})" 
                                                class="mt-1 px-2 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600">
                                            🗺️ 查看地图
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                            ${order.status === 'ready' ? `
                                <!-- 取件方式选择：同一水平线上 -->
                                <div class="flex gap-2 items-center">
                                    <button type="button" class="px-3 py-2 bg-gradient-to-r from-green-400 to-emerald-500 border border-green-500 rounded-lg text-white text-xs font-bold flex items-center gap-1 pickup-btn-store" 
                                            data-order-id="${order.orderId}" data-method="store_pickup">
                                        🏪 门店自提
                                    </button>
                                    <button type="button" class="px-4 py-2 bg-gradient-to-r from-yellow-400 via-red-500 via-orange-500 to-black rounded-lg text-white text-xs font-bold flex items-center gap-2 shadow-lg hover:shadow-xl transition-all pickup-btn-delivery" 
                                            data-order-id="${order.orderId}" data-method="home_delivery">
                                        🛵 跑腿配送
                                    </button>
                                </div>
                            ` : `
                                <!-- 非待取件状态显示配送方式标签 -->
                                <div class="flex items-center gap-1">
                                    ${order.deliveryMethod === 'courier' || order.pickupMethod === 'home_delivery' ? `
                                        <span class="px-3 py-1.5 bg-gradient-to-r from-yellow-400 via-red-500 via-orange-500 to-black rounded-lg text-white text-xs font-bold flex items-center gap-1">
                                            🛵 跑腿配送
                                        </span>
                                    ` : `
                                        <span class="px-3 py-1.5 bg-gradient-to-r from-green-400 to-emerald-500 rounded-lg text-white text-xs font-bold flex items-center gap-1">
                                            🏪 门店自提
                                        </span>
                                    `}
                                </div>
                            `}
                        </div>
                        
                        <!-- 状态标签（右上角） -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm text-gray-500">${order.createTime}</span>
                            <span class="status-tag ${status.class} shrink-0">
                                <span>${status.icon}</span>
                                <span>${status.text}</span>
                            </span>
                        </div>
                        
                        ${order.status === 'pending' ? `
                            <div class="flex gap-2 mt-4 pt-4 border-t border-gray-100">
                                <button class="flex-1 py-2 border border-red-300 text-red-500 rounded-lg text-sm font-medium" onclick="event.stopPropagation(); cancelOrder('${order.orderId}')">
                                    取消订单
                                </button>
                                <button class="flex-1 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-lg text-white text-sm font-medium" onclick="event.stopPropagation(); payOrder('${order.orderId}')">
                                    立即支付
                                </button>
                            </div>
                        ` : ''}
                        
                        ${['paid', 'confirmed', 'awaiting_store_confirm', 'received', 'cleaning', 'cleaned'].includes(order.status) ? `
                            <div class="flex gap-2 mt-4 pt-4 border-t border-gray-100">
                                <button class="flex-1 py-2 border border-red-300 text-red-500 rounded-lg text-sm font-medium" onclick="event.stopPropagation(); cancelOrderWithRefund('${order.orderId}')">
                                    申请取消/退款
                                </button>
                                <button class="flex-1 py-2 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-lg text-white text-sm font-medium" onclick="event.stopPropagation(); modifyOrder('${order.orderId}')">
                                    修改订单
                                </button>
                            </div>
                        ` : ''}
                        
                        ${order.status === 'ready' ? `
                            <div class="flex gap-2 mt-4 pt-4 border-t border-gray-100">
                                <button class="flex-1 py-2 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-lg text-white text-sm font-medium" onclick="event.stopPropagation(); viewOrder('${order.orderId}')">
                                    查看详情
                                </button>
                            </div>
                        ` : ''}
                        
                        <!-- 所有订单都显示：删除订单 和 再次下单 -->
                        <div class="flex gap-2 mt-4 pt-4 border-t border-gray-100">
                            <button class="flex-1 py-2.5 border-2 border-red-300 text-red-500 rounded-lg text-sm font-medium flex items-center justify-center gap-1 hover:bg-red-50 transition-colors" onclick="event.stopPropagation(); deleteOrder('${order.orderId}')">
                                <i class="fa fa-trash-o"></i> 删除订单
                            </button>
                            <button class="flex-1 py-2.5 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-lg text-white text-sm font-medium flex items-center justify-center gap-1" onclick="event.stopPropagation(); reorder('${order.orderId}')">
                                <i class="fa fa-refresh"></i> 再次下单
                            </button>
                        </div>
                        
                        ${order.status === 'completed' ? `
                            <div class="flex gap-2 mt-3">
                                <button class="flex-1 py-2 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-lg text-white text-sm font-medium flex items-center justify-center gap-1" onclick="event.stopPropagation(); rateOrder('${order.orderId}')">
                                    <i class="fa fa-star-o"></i> 待评价

            }).join('');
            
            // 将HTML设置到DOM
            ordersList.innerHTML = ordersHTML;
            
            // 存储当前订单列表（用于详情页）
            localStorage.setItem('current_orders', JSON.stringify(filteredOrders));
            
            console.log('[c-orders] 订单列表渲染完成，共', filteredOrders.length, '条');
        }

        // 查看订单详情
        async function viewOrder(orderId) {
            // 先从localStorage查找
            const orders = getUserOrders();
            let order = orders.find(o => o.orderId === orderId);
            
            // 如果本地没有，尝试从API获取
            if (!order) {
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || ''),
                            'Cache-Control': 'no-cache'
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        order = result.data;
                    }
                } catch (error) {
                    console.warn('从API获取订单失败:', error);
                }
            }
            
            if (order) {
                localStorage.setItem('currentOrder', JSON.stringify(order));
                window.location.href = 'c-order-detail.html?id=' + encodeURIComponent(orderId);
            } else {
                alert('未找到订单信息，请刷新页面重试');
            }
        }

        // 支付订单
        function payOrder(orderId) {
            console.log('[支付] 开始支付订单:', orderId);
            const orders = getUserOrders();
            
            // 灵活匹配订单ID
            const matchOrder = (o) => {
                return o.orderId === orderId || 
                       o.orderNo === orderId || 
                       o.id === orderId ||
                       o._id === orderId;
            };
            
            const order = orders.find(matchOrder);
            console.log('[支付] 查找结果:', { orderId, found: !!order });
            
            if (order) {
                localStorage.setItem('currentOrder', JSON.stringify(order));
                window.location.href = 'c-payment.html';
            } else {
                showToast('订单不存在，请刷新页面重试', 'error');
                console.error('[支付] 未找到订单:', orderId);
            }
        }

        // 取消订单（仅更新本地，未支付订单）
        async function cancelOrder(orderId) {
            console.log('[取消] 开始取消订单:', orderId);
            
            if (!confirm('确定要取消该订单吗？')) {
                return;
            }
            
            // 获取token
            const token = localStorage.getItem('userToken') || localStorage.getItem('authToken') || '';
            
            // 先尝试调用API
            try {
                const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({
                        reason: '用户主动取消',
                        requestTime: new Date().toISOString()
                    })
                });
                const result = await response.json();
                console.log('[取消] API响应:', result);
                
                if (result.success) {
                    showToast('订单已取消', 'success');
                } else {
                    console.warn('[取消] API取消失败:', result.error);
                }
            } catch (error) {
                console.warn('[取消] API调用失败，使用本地处理:', error);
            }
            
            // 更新本地状态 - 增强ID匹配逻辑
            const orders = getUserOrders();
            
            // 灵活匹配订单ID
            const matchOrder = (o) => {
                return o.orderId === orderId || 
                       o.orderNo === orderId || 
                       o.id === orderId ||
                       o._id === orderId;
            };
            
            const orderIndex = orders.findIndex(matchOrder);
            console.log('[取消] 本地查找结果:', { orderId, orderIndex, total: orders.length });
            
            if (orderIndex > -1) {
                orders[orderIndex].status = 'cancelled';
                orders[orderIndex].cancelledAt = new Date().toISOString();
                orders[orderIndex].updatedAt = new Date().toISOString();
                setUserOrders(orders);
                
                // 同步到门店订单（让M端能看到更新）
                syncOrderToStore(orders[orderIndex]);
                
                // 刷新页面以显示最新状态
                loadOrders();
                console.log('[取消] 订单已取消并刷新:', orderId);
            } else {
                console.warn('[取消] 本地未找到订单，尝试从API同步...');
                // 如果本地找不到，尝试强制同步后重试
                if (typeof OrderSyncManager !== 'undefined') {
                    await OrderSyncManager.sync();
                    const updatedOrders = getUserOrders();
                    const retryIndex = updatedOrders.findIndex(matchOrder);
                    
                    if (retryIndex > -1) {
                        updatedOrders[retryIndex].status = 'cancelled';
                        updatedOrders[retryIndex].cancelledAt = new Date().toISOString();
                        updatedOrders[retryIndex].updatedAt = new Date().toISOString();
                        setUserOrders(updatedOrders);
                        loadOrders();
                        showToast('订单已取消（已同步更新）', 'success');
                        console.log('[取消] 同步后取消成功:', orderId);
                    } else {
                        showToast('订单不存在，请刷新页面重试', 'error');
                        console.error('[取消] 同步后仍未找到订单:', orderId);
                    }
                } else {
                    showToast('订单不存在，请刷新页面', 'error');
                }
            }
        }

        // 申请取消并退款（已支付订单）
        async function cancelOrderWithRefund(orderId) {
            let orders = getUserOrders();
            let order = orders.find(o => o.orderId === orderId);
            
            // 如果本地没有，尝试从API获取
            if (!order) {
                try {
                    const token = localStorage.getItem('userToken') || localStorage.getItem('authToken') || '';
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': token ? `Bearer ${token}` : '',
                            'Content-Type': 'application/json'
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        const serverOrder = result.data;
                        order = {
                            orderId: serverOrder.orderNo,
                            id: serverOrder._id,
                            _id: serverOrder._id,
                            orderNo: serverOrder.orderNo,
                            items: serverOrder.items || [],
                            services: serverOrder.items ? serverOrder.items.map(item => ({
                                name: item.name,
                                icon: '📦',
                                price: item.price
                            })) : [],
                            store: { id: serverOrder.storeId, name: '服务网点' },
                            storeId: serverOrder.storeId,
                            status: serverOrder.status,
                            fees: {
                                total: serverOrder.amounts?.total || 0,
                                serviceFee: serverOrder.amounts?.subtotal || 0,
                                deliveryFee: serverOrder.amounts?.deliveryFee || 0,
                                discount: serverOrder.amounts?.discount || 0
                            },
                            createTime: new Date(serverOrder.createdAt).toLocaleString(),
                            createdAt: serverOrder.createdAt,
                            contact: serverOrder.delivery ? {
                                name: serverOrder.delivery.contactName,
                                phone: serverOrder.delivery.contactPhone,
                                address: serverOrder.delivery.address
                            } : {}
                        };
                        
                        // 【数据隔离】保存到用户隔离的 key
                        orders.push(order);
                        setUserOrders(orders);
                    }
                } catch (error) {
                    console.error('从API获取订单失败:', error);
                }
            }
            
            if (!order) {
                showToast('订单不存在', 'error');
                return;
            }

            const reason = prompt('请输入取消原因（选填）：');
            if (reason === null) return; // 用户点击取消

            if (confirm(`确定要申请取消订单并退款吗？\n订单金额：¥${order.fees?.total || 0}\n退款将原路返回至您的支付账户`)) {
                try {
                    // 获取token
                    const token = localStorage.getItem('userToken') || localStorage.getItem('authToken') || '';
                    
                    // 调用后端API申请退款
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/cancel`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': token ? `Bearer ${token}` : ''
                        },
                        body: JSON.stringify({
                            reason: reason || '用户主动取消',
                            refundMethod: 'original',
                            requestTime: new Date().toISOString()
                        })
                    });
                    const result = await response.json();
                    console.log('[取消退款] API响应:', result);
                    
                    if (result.success) {
                        showToast('取消申请已提交，退款将在1-3个工作日到账', 'success');
                    } else {
                        showToast(result.error || '取消失败', 'error');
                    }
                } catch (error) {
                    console.warn('API调用失败，本地处理:', error);
                    showToast('网络错误，已本地处理', 'warning');
                }

                // 重新读取订单列表（确保获取最新数据）
                orders = getUserOrders();
                const orderIndex = orders.findIndex(o => o.orderId === orderId);
                if (orderIndex > -1) {
                    orders[orderIndex].status = 'cancelled';
                    orders[orderIndex].cancelledAt = new Date().toISOString();
                    orders[orderIndex].refundStatus = 'processing';
                    orders[orderIndex].refundAmount = orders[orderIndex].fees?.total || 0;
                    orders[orderIndex].cancelReason = reason || '用户主动取消';
                    orders[orderIndex].updatedAt = new Date().toISOString();
                    setUserOrders(orders);
                    
                    // 同步到门店订单（让M端能看到更新）
                    syncOrderToStore(orders[orderIndex]);
                    
                    loadOrders();
                    showToast('订单已取消，退款处理中', 'success');
                }
            }
        }

        // 修改订单
        async function modifyOrder(orderId) {
            // 先从localStorage查找
            let orders = getUserOrders();
            let order = orders.find(o => o.orderId === orderId);
            
            // 如果本地没有，尝试从API获取
            if (!order) {
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        const serverOrder = result.data;
                        order = {
                            orderId: serverOrder.orderNo,
                            id: serverOrder._id,
                            _id: serverOrder._id,
                            orderNo: serverOrder.orderNo,
                            items: serverOrder.items || [],
                            services: serverOrder.items ? serverOrder.items.map(item => ({
                                name: item.name,
                                icon: '📦',
                                price: item.price
                            })) : [],
                            store: { id: serverOrder.storeId, name: '服务网点' },
                            storeId: serverOrder.storeId,
                            status: serverOrder.status,
                            fees: {
                                total: serverOrder.amounts?.total || 0,
                                serviceFee: serverOrder.amounts?.subtotal || 0,
                                deliveryFee: serverOrder.amounts?.deliveryFee || 0,
                                discount: serverOrder.amounts?.discount || 0
                            },
                            createTime: new Date(serverOrder.createdAt).toLocaleString(),
                            createdAt: serverOrder.createdAt,
                            contact: serverOrder.delivery ? {
                                name: serverOrder.delivery.contactName,
                                phone: serverOrder.delivery.contactPhone,
                                address: serverOrder.delivery.address
                            } : {}
                        };
                        
                        // 【数据隔离】保存到用户隔离的 key
                        orders.push(order);
                        setUserOrders(orders);
                    }
                } catch (error) {
                    console.error('从API获取订单失败:', error);
                }
            }
            
            if (!order) {
                showToast('订单不存在或无法修改', 'error');
                return;
            }

            // 保存当前订单到修改缓存
            localStorage.setItem('modifyingOrder', JSON.stringify(order));
            
            // 跳转到修改页面
            window.location.href = 'c-order-modify.html?orderId=' + encodeURIComponent(orderId);
        }

        // 选择取件方式
        function selectPickupMethod(orderId, method) {
            const orders = getUserOrders();
            const orderIndex = orders.findIndex(o => o.orderId === orderId);
            if (orderIndex > -1) {
                orders[orderIndex].pickupMethod = method;
                orders[orderIndex].pickupMethodSelectedAt = new Date().toISOString();
                setUserOrders(orders);
                
                // 到店自提：立即同步到后端（触发智能灯条）
                // 跑腿配送：不同步后端，等用户在 c-courier-select.html 选择服务商并支付后再调用API
                if (method === 'store_pickup') {
                    syncPickupMethodToServer(orderId, method);
                }
                
                // 根据取件方式跳转到不同的详情页
                if (method === 'store_pickup') {
                    // 到店自提：跳转到简洁的自提详情页
                    window.location.href = 'c-pickup-store.html?id=' + encodeURIComponent(orderId);
                } else if (method === 'home_delivery') {
                    // 跑腿配送：显示地址弹窗，然后跳转到服务商选择页（API报价+一对一/拼单）
                    _pendingDeliveryOrderId = orderId;
                    _pendingDeliveryCatId = orders[orderIndex].categoryId || 'cleaning';
                    // 预填已保存的地址
                    const savedInfo = JSON.parse(localStorage.getItem('userDeliveryInfo') || '{}');
                    document.getElementById('modalAddr').value = savedInfo.deliveryAddress || '';
                    document.getElementById('modalContact').value = savedInfo.deliveryContact || '';
                    document.getElementById('modalPhone').value = savedInfo.deliveryPhone || '';
                    document.getElementById('deliveryAddrModal').style.display = 'flex';
                }
            }
        }
        
        let _pendingDeliveryOrderId = null;
        let _pendingDeliveryCatId = 'cleaning';
        
        function closeDeliveryAddrModal() {
            document.getElementById('deliveryAddrModal').style.display = 'none';
            _pendingDeliveryOrderId = null;
        }
        
        function confirmDeliveryAddr() {
            const addr = document.getElementById('modalAddr').value.trim();
            const contact = document.getElementById('modalContact').value.trim();
            const phone = document.getElementById('modalPhone').value.trim();
            if (!addr || !contact || !phone) {
                alert('请填写完整的配送地址、联系人和电话');
                return;
            }
            // 保存用户配送信息到localStorage
            localStorage.setItem('userDeliveryInfo', JSON.stringify({
                deliveryAddress: addr, deliveryContact: contact, deliveryPhone: phone
            }));
            // 关闭弹窗
            closeDeliveryAddrModal();
            // 跳转到服务商选择页（API报价 + 一对一/拼单 + 支付）
            const params = new URLSearchParams({
                orderId: _pendingDeliveryOrderId,
                address: addr, contact: contact, phone: phone,
                categoryId: _pendingDeliveryCatId
            });
            window.location.href = 'c-courier-select.html?' + params.toString();
        }
        
        // 同步取件方式到后端
        async function syncPickupMethodToServer(orderId, method) {
            try {
                const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/pickup-method`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ method: method })
                });
                const result = await response.json();
                if (result.success) {
                    console.log('取件方式已同步到后端:', result.data);
                }
            } catch (error) {
                console.warn('同步取件方式到后端失败:', error);
            }
        }

        // 同步订单到门店订单列表（让M端能看到C端订单变化）
        function syncOrderToStore(order) {
            try {
                const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
                const orderStoreId = order.storeId || (order.store ? order.store.id : null);
                
                if (!orderStoreId) {
                    console.warn('订单没有门店ID，无法同步到门店');
                    return;
                }
                
                // 查找是否已存在（支持多种ID格式匹配）
                const existingIndex = storeOrders.findIndex(o => 
                    o.orderId === order.orderId || 
                    o.id === order.orderId ||
                    o._id === order.orderId ||
                    o.orderNo === order.orderId ||
                    o.orderNo === order.orderNo
                );
                
                // 保留原有的orderNo，不要覆盖
                const storeOrder = {
                    ...order,
                    orderNo: order.orderNo || order.orderId,
                    _id: order._id || order.id || order.orderId,
                    storeId: orderStoreId,
                    updatedAt: new Date().toISOString()
                };
                
                if (existingIndex > -1) {
                    // 更新现有订单 - 保留原有的关键字段
                    const existingOrder = storeOrders[existingIndex];
                    storeOrders[existingIndex] = { 
                        ...existingOrder, 
                        ...storeOrder,
                        orderId: existingOrder.orderId || order.orderId,
                        orderNo: existingOrder.orderNo || order.orderNo || order.orderId
                    };
                    console.log('[同步] 更新门店订单:', order.orderId, '索引:', existingIndex);
                } else {
                    // 添加新订单
                    storeOrders.push(storeOrder);
                    console.log('[同步] 添加新订单到门店:', order.orderId);
                }
                
                localStorage.setItem('store_orders', JSON.stringify(storeOrders));
            } catch (error) {
                console.error('[同步] 同步订单到门店失败:', error);
            }
        }

        // 删除订单记录
        async function deleteOrder(orderId) {
            console.log('[删除] 开始删除订单:', orderId);
            
            // 尝试从多个存储位置获取订单
            const orders = getUserOrders();
            const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            
            // 灵活匹配订单（支持orderId、orderNo、id等）
            const findOrder = (orderList) => {
                return orderList.find(o => 
                    o.orderId === orderId || 
                    o.orderNo === orderId ||
                    o.id === orderId ||
                    o._id === orderId
                );
            };
            
            let order = findOrder(orders) || findOrder(storeOrders);
            
            // 如果本地没有，尝试从API获取以验证订单状态
            if (!order) {
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}`, {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('userToken') || localStorage.getItem('authToken') || '')
                        }
                    });
                    const result = await response.json();
                    if (result.success && result.data) {
                        const serverOrder = result.data;
                        order = {
                            orderId: serverOrder.orderNo || serverOrder.orderId || orderId,
                            status: serverOrder.status
                        };
                        console.log('[删除] 从API获取订单状态:', order.status);
                    }
                } catch (error) {
                    console.error('[删除] 从API获取订单失败:', error);
                }
            }
            
            if (!order) {
                console.log('[删除] 订单不存在，强制从本地删除');
                // 订单不存在时，强制从本地列表移除（用于清理脏数据）
                const updatedOrders = orders.filter(o => 
                    o.orderId !== orderId && o.orderNo !== orderId && o.id !== orderId && o._id !== orderId
                );
                const updatedStoreOrders = storeOrders.filter(o => 
                    o.orderId !== orderId && o.orderNo !== orderId && o.id !== orderId && o._id !== orderId
                );
                setUserOrders(updatedOrders);
                localStorage.setItem('store_orders', JSON.stringify(updatedStoreOrders));
                loadOrders();
                showToast('订单记录已删除', 'success');
                return;
            }
            
            // 正在处理中的订单不能删除
            const activeStatuses = ['pending', 'paid', 'confirmed', 'processing', 'cleaning', 'cleaned', 'ready', 'awaiting_store_confirm', 'received', 'in_progress'];
            if (activeStatuses.includes(order.status)) {
                console.log('[删除] 订单状态不允许删除:', order.status);
                showToast('正在处理中的订单无法删除，请等待处理完成', 'error');
                return;
            }
            
            if (confirm('确定要删除该订单记录吗？\n此操作将从所有设备上移除该记录。')) {
                // 1. 先调用后端API进行软删除（关键：同步到小程序和其他端）
                let serverDeleted = false;
                try {
                    const token = localStorage.getItem('userToken') || '';
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/delete`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': token ? `Bearer ${token}` : ''
                        }
                    });
                    const result = await response.json();
                    if (result.success) {
                        serverDeleted = true;
                        console.log('[删除] 后端删除成功:', orderId);
                    } else {
                        console.warn('[删除] 后端删除返回失败:', result.error);
                    }
                } catch (error) {
                    console.warn('[删除] 后端API调用失败，仅执行本地删除:', error.message);
                }
                
                // 2. 从所有存储位置删除订单（本地清理）
                const updatedOrders = orders.filter(o => 
                    o.orderId !== orderId && o.orderNo !== orderId && o.id !== orderId && o._id !== orderId
                );
                const updatedStoreOrders = storeOrders.filter(o => 
                    o.orderId !== orderId && o.orderNo !== orderId && o.id !== orderId && o._id !== orderId
                );
                setUserOrders(updatedOrders);
                localStorage.setItem('store_orders', JSON.stringify(updatedStoreOrders));
                
                // 3. 将删除的订单ID记录到本地（兜底，防止同步模块重新拉回）
                let deletedOrderIds = JSON.parse(localStorage.getItem('deleted_order_ids') || '[]');
                const idsToTrack = [orderId, order.orderId, order.orderNo].filter(Boolean);
                idsToTrack.forEach(id => {
                    if (!deletedOrderIds.includes(id)) {
                        deletedOrderIds.push(id);
                    }
                });
                localStorage.setItem('deleted_order_ids', JSON.stringify(deletedOrderIds));
                
                // 4. 刷新订单列表
                loadOrders();
                showToast('订单记录已删除', 'success');
                
                console.log('[删除] 订单已成功删除:', orderId, serverDeleted ? '(已同步到服务器)' : '(仅本地)');
            }
        }

        // 再来一单
        async function reorder(orderId) {
            const orders = getUserOrders();
            const order = orders.find(o => o.orderId === orderId);
            
            if (!order) {
                showToast('订单不存在', 'error');
                return;
            }
            
            // 保存订单信息用于再来一单
            localStorage.setItem('selectedService', JSON.stringify(order.services[0] || {}));
            localStorage.setItem('selectedStore', JSON.stringify(order.store || {}));
            
            // 跳转到下单页面
            showToast('正在跳转下单页面...', 'success');
            setTimeout(() => {
                window.location.href = 'c-order.html';
            }, 500);
        }

        // 待评价（跳转到评价页面或显示评分弹窗）
        function rateOrder(orderId) {
            // 保存当前订单ID用于评价
            localStorage.setItem('ratingOrderId', orderId);
            
            // 跳转到订单详情页（评价功能可在详情页完成）
            window.location.href = 'c-order-detail.html?id=' + encodeURIComponent(orderId) + '&action=rate';
        }

        // 确认取件
        async function pickupOrder(orderId) {
            const orders = getUserOrders();
            const orderIndex = orders.findIndex(o => o.orderId === orderId);
            if (orderIndex === -1) return;
            
            const order = orders[orderIndex];
            const pickupMethod = order.pickupMethod || 'store_pickup';
            
            if (pickupMethod === 'home_delivery' && !order.deliveryAddress) {
                alert('您选择了跑腿配送，请先填写配送地址');
                viewOrder(orderId);
                return;
            }
            
            if (confirm(`确认已取件吗？\n取件方式：${pickupMethod === 'store_pickup' ? '到店自提' : '跑腿配送'}`)) {
                // 先调用API
                try {
                    const response = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/pickup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            pickupMethod: pickupMethod,
                            pickupTime: new Date().toISOString()
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        console.log('取件已确认:', result.data);
                    }
                } catch (error) {
                    console.error('API调用失败:', error);
                    alert('取件确认失败，请稍后重试：' + (error.message || '网络错误'));
                    return;
                }
                
                // 更新本地状态
                orders[orderIndex].status = 'completed';
                orders[orderIndex].completedAt = new Date().toISOString();
                setUserOrders(orders);
                loadOrders();
                
                // 显示成功提示
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
                toast.innerHTML = '<i class="fas fa-check-circle mr-2"></i>取件成功！';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }
        }

        // 页面跳转
        function goToPage(url) {
            window.location.href = url;
        }
        
        // Toast提示函数
        function showToast(message, type = 'success') {
            // 移除已有的toast
            const existingToast = document.querySelector('.custom-toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'custom-toast fixed top-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50 text-white text-sm font-medium';
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle text-green-100' : 'fa-exclamation-circle text-red-100'} mr-2"></i>${message}`;
            
            // 根据类型设置背景颜色
            if (type === 'success') {
                toast.className += ' bg-gradient-to-r from-green-500 to-emerald-500';
            } else if (type === 'error') {
                toast.className += ' bg-gradient-to-r from-red-500 to-rose-500';
            } else if (type === 'warning') {
                toast.className += ' bg-gradient-to-r from-yellow-500 to-orange-500';
            } else {
                toast.className += ' bg-gray-600';
            }
            
            document.body.appendChild(toast);
            
            // 添加动画
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(-20px)';
            toast.style.transition = 'all 0.3s ease-out';
            
            setTimeout(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            }, 10);
            
            // 自动移除
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // 显示门店地图
        let storeMap = null;
        function showStoreMap(storeId, storeName, address, lng, lat) {
            console.log('[地图] 收到坐标:', { lng, lat, type: typeof lng, type2: typeof lat });
            
            // 验证坐标值
            const lngNum = parseFloat(lng);
            const latNum = parseFloat(lat);
            
            if (isNaN(lngNum) || isNaN(latNum)) {
                alert('门店坐标无效，无法显示地图');
                console.error('[地图] 坐标无效:', lng, lat);
                return;
            }
            
            // 中国坐标范围检查（约）
            const isValidChinaCoords = latNum >= 15 && latNum <= 60 && lngNum >= 70 && lngNum <= 140;
            if (!isValidChinaCoords) {
                console.warn('[地图] 坐标可能不在中国范围内:', latNum, lngNum);
            }
            
            // 创建模态框
            const modal = document.createElement('div');
            modal.id = 'storeMapModal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4';
            modal.onclick = function(e) {
                if (e.target === modal) closeStoreMap();
            };
            
            modal.innerHTML = `
                <div class="bg-white rounded-lg shadow-2xl w-full max-w-2xl">
                    <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">🏪 ${storeName}</h3>
                            <p class="text-sm text-gray-500 mt-1">📍 ${address}</p>
                        </div>
                        <button onclick="closeStoreMap()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                    </div>
                    <div id="storeMapContainer" class="w-full h-80 bg-gray-100"></div>
                    <div class="p-4 bg-gray-50 rounded-b-lg">
                        <p class="text-sm text-gray-600 text-center">
                            📍 地址: ${address}<br>
                            🗺️ 坐标: 纬度 ${latNum.toFixed(6)}, 经度 ${lngNum.toFixed(6)}
                        </p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 初始化地图（使用纬度,经度顺序）
            setTimeout(() => {
                try {
                    if (storeMap) {
                        storeMap.remove();
                    }
                    storeMap = L.map('storeMapContainer').setView([latNum, lngNum], 16);
                    
                    // 添加地图图层
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                    }).addTo(storeMap);
                    
                    // 添加标记
                    const marker = L.marker([latNum, lngNum]).addTo(storeMap);
                    marker.bindPopup(`<b>${storeName}</b><br>${address}`).openPopup();
                    
                    console.log('[地图] 地图初始化成功');
                } catch (error) {
                    console.error('[地图] 初始化失败:', error);
                    alert('地图加载失败: ' + error.message);
                }
            }, 100);
        }
        
        function closeStoreMap() {
            const modal = document.getElementById('storeMapModal');
            if (modal) modal.remove();
            if (storeMap) {
                storeMap.remove();
                storeMap = null;
            }
        }
    </script>
</body>
</html>
