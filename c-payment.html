<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单支付 - 干洗服务</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- qrcode-generator 二维码生成库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc',
                        info: '#3b82f6',
                        purple: '#8b5cf6',
                        pink: '#ec4899',
                        teal: '#14b8a6',
                        orange: '#f97316'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 页面头部 */
        .page-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 32rpx;
            padding-top: calc(env(safe-area-inset-top) + 20rpx);
        }
        
        /* 倒计时 */
        .countdown-bar {
            display: flex;
            align-items: center;
            gap: 12rpx;
            background: rgba(255, 255, 255, 0.2);
            padding: 12rpx 20rpx;
            border-radius: 16rpx;
            width: fit-content;
        }
        
        .countdown-time {
            font-size: 28rpx;
            font-weight: 700;
            color: #fef3c7;
            font-family: monospace;
        }
        
        /* 信息卡片 */
        .info-card {
            background: #ffffff;
            border-radius: 20rpx;
            padding: 24rpx;
            box-shadow: 0 4rpx 16rpx rgba(0, 0, 0, 0.06);
        }
        
        /* 订单号 */
        .order-id-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eff6ff;
            padding: 20rpx 24rpx;
            border-radius: 16rpx;
        }
        
        /* 费用明细 */
        .fee-card {
            background: #ffffff;
            border-radius: 20rpx;
            padding: 24rpx;
            box-shadow: 0 4rpx 16rpx rgba(0, 0, 0, 0.06);
        }
        
        .fee-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16rpx 0;
        }
        
        .fee-divider {
            height: 2rpx;
            background: #e5e7eb;
            margin: 12rpx 0;
        }
        
        /* 支付方式 */
        .payment-item {
            display: flex;
            align-items: center;
            gap: 20rpx;
            padding: 28rpx 24rpx;
            border-bottom: 1rpx solid #f3f4f6;
            transition: background 0.3s;
            cursor: pointer;
        }
        
        .payment-item:last-child {
            border-bottom: none;
        }
        
        .payment-item.selected {
            background: #eff6ff;
        }
        
        .payment-item:active {
            background: #dbeafe;
        }
        
        /* 单选框 */
        .radio-outer {
            width: 40rpx;
            height: 40rpx;
            border: 2rpx solid #d1d5db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .payment-item.selected .radio-outer {
            border-color: #3b82f6;
        }
        
        .radio-inner {
            width: 24rpx;
            height: 24rpx;
            background: #3b82f6;
            border-radius: 50%;
        }
        
        /* 推荐标签 */
        .recommended-tag {
            position: absolute;
            top: 16rpx;
            right: 16rpx;
            background: #fef3c7;
            padding: 6rpx 16rpx;
            border-radius: 12rpx;
        }
        
        /* 积分卡片 */
        .points-card {
            display: flex;
            align-items: center;
            gap: 16rpx;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 24rpx;
            border-radius: 20rpx;
        }
        
        /* 底部支付栏 */
        .pay-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            padding: 24rpx;
            padding-bottom: calc(24rpx + env(safe-area-inset-bottom));
            box-shadow: 0 -4rpx 20rpx rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        
        .pay-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 28rpx 64rpx;
            border-radius: 28rpx;
            box-shadow: 0 4rpx 16rpx rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }
        
        .pay-btn:active {
            transform: scale(0.98);
        }
        
        .pay-btn.paying {
            background: #e5e7eb;
            box-shadow: none;
        }
        
        /* 取消订单 */
        .cancel-bar {
            position: fixed;
            bottom: calc(120rpx + env(safe-area-inset-bottom));
            left: 0;
            right: 0;
            text-align: center;
            padding: 16rpx;
            z-index: 99;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-56">
    <!-- 页面头部 -->
    <div class="page-header">
        <div class="flex items-center gap-4 mb-4">
            <a href="c-order.html" class="text-white">
                <i class="fa fa-arrow-left text-lg"></i>
            </a>
            <span class="text-white font-bold text-xl flex-1">订单支付</span>
        </div>
        <!-- 倒计时 -->
        <div class="countdown-bar">
            <span class="text-white/90 text-sm">剩余支付时间</span>
            <span id="countdown" class="countdown-time">30:00</span>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="px-4 py-6">
        <!-- 订单信息 -->
        <div id="order-info" class="mb-4">
            <div class="info-card">
                <div class="flex items-center gap-2 mb-4 pb-4 border-b border-gray-100">
                    <span class="text-2xl">🏪</span>
                    <span id="store-name" class="font-bold text-gray-800">门店名称</span>
                </div>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-500">服务项目</span>
                        <span id="services-count" class="text-gray-800">0项</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">取件方式</span>
                        <span id="delivery-method" class="text-gray-800">-</span>
                    </div>
                    <div id="provider-row" class="hidden flex justify-between">
                        <span class="text-gray-500">配送服务商</span>
                        <span id="provider-name" class="text-gray-800">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">预约时间</span>
                        <span id="pickup-time" class="text-gray-800">-</span>
                    </div>
                    <div id="address-row" class="flex justify-between">
                        <span class="text-gray-500">门店地址</span>
                        <span id="store-address" class="text-gray-800 text-right max-w-48">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 订单号 -->
        <div class="mb-4">
            <div class="order-id-card">
                <span class="text-sm text-blue-600 font-medium">订单编号</span>
                <span id="order-id" class="text-sm text-blue-600 font-bold font-mono">-</span>
            </div>
        </div>

        <!-- 费用明细 -->
        <div class="mb-4">
            <h3 class="font-bold text-gray-800 mb-3">费用明细</h3>
            <div class="fee-card">
                <div class="fee-row">
                    <span class="text-gray-500">门店服务费</span>
                    <span id="fee-store" class="text-gray-800 font-semibold">¥0</span>
                </div>
                <div id="fee-discount-row" class="fee-row hidden">
                    <span class="text-green-500">自取折扣</span>
                    <span id="fee-discount" class="text-green-500 font-semibold">-¥0</span>
                </div>
                <div id="fee-delivery-row" class="fee-row hidden">
                    <span class="text-gray-500">配送费</span>
                    <span id="fee-delivery" class="text-gray-800 font-semibold">¥0</span>
                </div>
                <div class="fee-divider"></div>
                <div class="fee-row items-center">
                    <span class="font-bold text-gray-800">应付金额</span>
                    <span id="fee-total" class="text-2xl font-bold text-red-500">¥0</span>
                </div>
            </div>
        </div>

        <!-- 支付方式 -->
        <div class="mb-4">
            <h3 class="font-bold text-gray-800 mb-3">选择支付方式</h3>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <!-- 微信支付 -->
                <div class="payment-item selected" onclick="selectPayment('wechat')" id="payment-wechat">
                    <div class="radio-outer">
                        <div class="radio-inner"></div>
                    </div>
                    <span class="text-4xl">💬</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">微信支付</span>
                        <span class="text-xs text-gray-400 block">推荐</span>
                    </div>
                    <div class="absolute top-4 right-4">
                        <span class="bg-red-100 text-red-600 text-xs font-semibold px-2 py-1 rounded">推荐</span>
                    </div>
                </div>
                
                <!-- 会员卡支付 -->
                <div class="payment-item" onclick="selectPayment('member_card')" id="payment-member_card">
                    <div class="radio-outer">
                        <div class="radio-inner hidden"></div>
                    </div>
                    <span class="text-4xl">💳</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">会员卡支付</span>
                        <span id="member-card-display" class="text-sm text-gray-500 block">可用余额: ¥0.00</span>
                    </div>
                </div>
                
                <!-- 账户余额 -->
                <div class="payment-item" onclick="selectPayment('balance')" id="payment-balance">
                    <div class="radio-outer">
                        <div class="radio-inner hidden"></div>
                    </div>
                    <span class="text-4xl">💰</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">账户余额</span>
                        <span id="balance-display" class="text-sm text-gray-500 block">¥0.00</span>
                    </div>
                </div>
                
                <!-- 支付宝 -->
                <div class="payment-item" onclick="selectPayment('alipay')" id="payment-alipay">
                    <div class="radio-outer">
                        <div class="radio-inner hidden"></div>
                    </div>
                    <span class="text-4xl">💰</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">支付宝</span>
                        <span class="text-xs text-gray-400 block">安全便捷</span>
                    </div>
                </div>
                
                <!-- 银行卡 -->
                <div class="payment-item" onclick="selectPayment('unionpay')" id="payment-unionpay">
                    <div class="radio-outer">
                        <div class="radio-inner hidden"></div>
                    </div>
                    <span class="text-4xl">🏦</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">银行卡支付</span>
                        <span class="text-xs text-gray-400 block">支持多家银行</span>
                    </div>
                </div>
                
                <!-- 现金支付 -->
                <div class="payment-item" onclick="selectPayment('cash')" id="payment-cash">
                    <div class="radio-outer">
                        <div class="radio-inner hidden"></div>
                    </div>
                    <span class="text-4xl">💵</span>
                    <div class="flex-1">
                        <span class="font-semibold text-gray-800">现金支付</span>
                        <span class="text-xs text-gray-400 block">到店现金支付，支持扫码</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 会员积分 -->
        <div class="mb-4">
            <div class="points-card">
                <span class="text-4xl">⭐</span>
                <div>
                    <span class="text-sm text-amber-700 block">支付完成后可获得</span>
                    <span id="points-value" class="text-lg font-bold text-amber-800">0 积分</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 取消订单 -->
    <div class="cancel-bar">
        <span id="cancel-btn" class="text-gray-400 text-sm underline cursor-pointer" onclick="cancelOrder()">取消订单</span>
    </div>

    <!-- 底部支付栏 -->
    <div class="pay-bar">
        <div class="flex items-center gap-4">
            <div class="flex-1">
                <span class="text-sm text-gray-500 block">实付金额</span>
                <span id="pay-amount" class="text-3xl font-bold text-red-500">¥0</span>
            </div>
            <div id="pay-btn" class="pay-btn cursor-pointer" onclick="confirmPayment()">
                <span class="text-white font-bold text-lg">确认支付</span>
            </div>
        </div>
    </div>

    <!-- API引用 -->
    <script src="api/payment-api.js"></script>
    <script>
        // 订单数据
        let order = null;
        let selectedPayment = 'wechat';
        let countdownSeconds = 30 * 60; // 30分钟
        let countdownTimer = null;
        let userBalance = 500; // 模拟用户余额
        let memberCards = []; // 会员卡列表
        let selectedMemberCard = null; // 选中的会员卡

        // 配送费支付模式参数
        let isDeliveryOnly = false;   // 是否仅支付配送费
        let deliveryOnlyFee = 0;      // 配送费金额
        let deliveryProvider = '';    // 配送服务商
        let deliveryModeType = 'solo'; // 配送模式

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态
            if (!localStorage.getItem('userToken')) {
                window.location.href = 'c-login.html';
                return;
            }
            
            // 解析URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const paymentType = urlParams.get('type');
            if (paymentType === 'delivery') {
                isDeliveryOnly = true;
                deliveryOnlyFee = parseFloat(urlParams.get('fee') || '0');
                deliveryProvider = urlParams.get('provider') || '';
                deliveryModeType = urlParams.get('mode') || 'solo';
            }
            
            loadOrder();
            loadMemberCards();
            startCountdown();
        });
        
        // 加载会员卡信息
        async function loadMemberCards() {
            const userId = localStorage.getItem('userId');
            if (!userId) return;
            
            try {
                // 从API获取会员卡
                const response = await fetch(`http://localhost:3002/api/member-card/user/${userId}`);
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    memberCards = result.data;
                    updateMemberCardDisplay();
                }
            } catch (error) {
                console.warn('获取会员卡失败:', error);
                // 使用示例数据
                memberCards = [
                    {
                        cardId: 'SYS_001',
                        cardType: 'system',
                        cardName: '干洗平台会员卡',
                        balance: 500.00
                    }
                ];
                updateMemberCardDisplay();
            }
        }
        
        // 更新会员卡显示
        function updateMemberCardDisplay() {
            const display = document.getElementById('member-card-display');
            if (!display) return;
            
            if (memberCards.length === 0) {
                display.textContent = '暂无可用会员卡';
                return;
            }
            
            // 显示余额最高的卡
            const maxCard = memberCards.reduce((max, card) => 
                card.balance > max.balance ? card : max, memberCards[0]);
            
            const cardTypeText = maxCard.cardType === 'system' ? '平台卡' : '商家卡';
            display.textContent = `${cardTypeText} ¥${maxCard.balance.toFixed(2)}`;
            
            // 保存选中的会员卡
            selectedMemberCard = maxCard;
        }
        
        // 显示会员卡选择弹窗
        function showMemberCardSelector() {
            if (memberCards.length === 0) {
                alert('您还没有会员卡，请先办理会员卡');
                return;
            }
            
            const cardsHtml = memberCards.map((card, index) => `
                <div class="p-4 border-b border-gray-200 cursor-pointer hover:bg-gray-50 ${index === 0 ? 'bg-blue-50' : ''}" 
                     onclick="selectMemberCardByIndex(${index})">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-semibold text-gray-800">${card.cardName}</div>
                            <div class="text-sm text-gray-500">${card.cardType === 'system' ? '平台通用' : '商家专属'}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-bold text-red-500">¥${card.balance.toFixed(2)}</div>
                            ${card.cardLevel ? `<div class="text-xs text-gray-400">${card.cardLevel}</div>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            
            const modal = document.createElement('div');
            modal.id = 'member-card-modal';
            modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-end';
            modal.innerHTML = `
                <div class="bg-white w-full rounded-t-3xl p-6 max-h-[70vh] overflow-y-auto">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold">选择会员卡</h3>
                        <button onclick="closeMemberCardModal()" class="text-gray-400">
                            <i class="fa fa-times text-2xl"></i>
                        </button>
                    </div>
                    <div class="space-y-2">
                        ${cardsHtml}
                    </div>
                    <div class="mt-4">
                        <button onclick="goToRecharge()" class="w-full bg-blue-500 text-white py-3 rounded-xl font-semibold">
                            <i class="fa fa-plus mr-2"></i>办理/充值会员卡
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeMemberCardModal();
            });
        }
        
        // 选择会员卡
        function selectMemberCardByIndex(index) {
            selectedMemberCard = memberCards[index];
            updateMemberCardDisplay();
            closeMemberCardModal();
            
            // 根据支付模式使用对应的金额
            const payAmount = isDeliveryOnly ? deliveryOnlyFee : (order?.fees?.total || 0);
            
            // 选中的卡余额不足
            if (selectedMemberCard.balance < payAmount) {
                alert(`会员卡余额不足，当前余额: ¥${selectedMemberCard.balance.toFixed(2)}，需支付: ¥${payAmount.toFixed(2)}`);
            }
        }
        
        // 关闭会员卡选择弹窗
        function closeMemberCardModal() {
            const modal = document.getElementById('member-card-modal');
            if (modal) modal.remove();
        }
        
        // 跳转到充值页面
        function goToRecharge() {
            closeMemberCardModal();
            window.location.href = 'c-recharge.html';
        }

        // 加载订单数据
        function loadOrder() {
            const orderData = localStorage.getItem('currentOrder');
            if (!orderData) {
                alert('订单信息不存在');
                window.location.href = 'c-index.html';
                return;
            }
            
            order = JSON.parse(orderData);
            
            // ===== 配送费单独支付模式 =====
            if (isDeliveryOnly) {
                document.title = '配送费支付 - 干洗服务';
                document.querySelector('.page-header .text-xl').textContent = '配送费支付';
                
                // 修改取消按钮
                const cancelBtn = document.getElementById('cancel-btn');
                if (cancelBtn) {
                    cancelBtn.textContent = '返回';
                    cancelBtn.onclick = function() { window.location.href = 'c-courier-select.html?' + window.location.search.substring(1); };
                }
                
                // 配送服务商名称映射
                const providerNames = {
                    'meituan': '美团跑腿', 'jd': '京东秒送', 'sf': '顺丰跑腿', 'taobao': '淘宝闪购'
                };
                const providerName = providerNames[deliveryProvider] || deliveryProvider || '未选择';
                
                // 订单信息显示
                document.getElementById('store-name').textContent = order.store?.name || '系统自动分配门店';
                document.getElementById('services-count').textContent = '1项';
                document.getElementById('delivery-method').textContent = '跑腿配送到家';
                document.getElementById('pickup-time').textContent = order.time?.text || '-';
                document.getElementById('store-address').textContent = order.store?.address || '-';
                document.getElementById('order-id').textContent = order.orderId || order.orderNo || '-';
                
                // 服务商信息
                document.getElementById('provider-row').classList.remove('hidden');
                document.getElementById('provider-name').textContent = `${providerName} · ${deliveryModeType === 'shared' ? '拼单配送' : '一对一专送'}`;
                
                // 费用：仅显示配送费
                document.getElementById('fee-store').textContent = `¥0`;
                document.getElementById('fee-delivery-row').classList.remove('hidden');
                document.getElementById('fee-delivery').textContent = `¥${deliveryOnlyFee.toFixed(2)}`;
                document.getElementById('fee-total').textContent = `¥${deliveryOnlyFee.toFixed(2)}`;
                document.getElementById('pay-amount').textContent = `¥${deliveryOnlyFee.toFixed(2)}`;
                
                // 积分
                document.getElementById('points-value').textContent = `${Math.floor(deliveryOnlyFee / 10) * 10} 积分`;
                
                // 账户余额
                document.getElementById('balance-display').textContent = `¥${userBalance.toFixed(2)}`;
                
                // 隐藏自取折扣行
                document.getElementById('fee-discount-row').classList.add('hidden');
                
                // 修改费用标题
                const feeSectionTitle = document.querySelector('.mb-4 h3.font-bold');
                if (feeSectionTitle) feeSectionTitle.textContent = '配送费用';
                
                // 隐藏配送方式提示（非首次下单）
                return;
            }
            
            // ===== 正常订单支付模式 =====
            // 更新UI
            document.getElementById('store-name').textContent = order.store ? order.store.name : '系统自动分配门店';
            document.getElementById('services-count').textContent = `${order.services.length}项`;
            document.getElementById('delivery-method').textContent = order.deliveryMethod === 'pickup' ? '自送到店' : '跑腿上门取件';
            document.getElementById('pickup-time').textContent = order.time ? order.time.text : '-';
            document.getElementById('store-address').textContent = order.store ? order.store.address : '-';
            document.getElementById('order-id').textContent = order.orderId;

                        orderId: order.orderId || order.orderNo,

                if (result.success && result.data.imageData) {

                        source: 'wechat_mini'

                        storeId: storeId,

                        customerPhone: order.contact?.phone,

                        amount: payAmount,
                        source: 'pos'

                    type: isDeliveryOnly ? 'delivery_pay' : 'order_pay',

        // 生成二维码图片
        function generateQRCodeImage(containerId, text) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            // 检查qrcode库是否已加载
            if (typeof qrcode === 'undefined') {
                console.warn('qrcode库未加载，等待重试...');
                // 等待库加载后重试
                setTimeout(() => generateQRCodeImage(containerId, text), 500);
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            container.innerHTML = '';
            container.appendChild(canvas);
            
            try {
                const qr = qrcode(0, 'M');
                qr.addData(text);
                qr.make();
                
                const ctx = canvas.getContext('2d');
                const size = 200;
                const cellSize = size / qr.getModuleCount();
                
                // 绘制白色背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                
                // 绘制彩虹渐变背景
                const gradient = ctx.createLinearGradient(0, 0, size, 0);
                gradient.addColorStop(0, '#ff6b6b');     // 红色
                gradient.addColorStop(0.17, '#ff9f43');  // 橙色
                gradient.addColorStop(0.33, '#feca57');  // 黄色
                gradient.addColorStop(0.5, '#1dd1a1');   // 绿色
                gradient.addColorStop(0.67, '#48dbfb');  // 蓝色
                gradient.addColorStop(0.83, '#5f27cd');  // 紫色
                gradient.addColorStop(1, '#ff6b6b');    // 回到红色
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);
                
                // 绘制二维码（使用QRCode的黑白色）
                ctx.fillStyle = '#000000';
                for (let row = 0; row < qr.getModuleCount(); row++) {
                    for (let col = 0; col < qr.getModuleCount(); col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                        }
                    }
                }
                
                console.log('二维码生成成功:', text);
            } catch (error) {
                console.error('生成二维码失败:', error);
                // 使用占位符
                container.innerHTML = '<div class="text-center"><i class="fa fa-qrcode text-5xl text-gray-400"></i><p class="text-xs text-gray-400 mt-2">二维码加载中...</p></div>';
            }
        }

        // 确认支付
        async function confirmPayment() {
            const payBtn = document.getElementById('pay-btn');
            const originalText = payBtn.querySelector('span').textContent;
            
            // 配送费支付的应付金额
            const payAmount = isDeliveryOnly ? deliveryOnlyFee : (order.fees?.total || 0);
            
            // 处理现金支付 - 生成二维码
            if (selectedPayment === 'cash') {
                payBtn.classList.add('paying');
                payBtn.querySelector('span').textContent = '生成中...';
                await generatePOSQRCode();
                payBtn.classList.remove('paying');
                payBtn.querySelector('span').textContent = originalText;
                return;
            }
            
            // 处理会员卡支付
            if (selectedPayment === 'member_card') {
                if (!selectedMemberCard) {
                    alert('请先选择会员卡');
                    return;
                }
                if (selectedMemberCard.balance < payAmount) {
                    alert(`会员卡余额不足，当前余额: ¥${selectedMemberCard.balance.toFixed(2)}，需支付: ¥${payAmount.toFixed(2)}`);
                    return;
                }
            }
            
            payBtn.classList.add('paying');
            payBtn.querySelector('span').textContent = '支付中...';
            payBtn.classList.remove('cursor-pointer');
            
            try {
                // 会员卡支付
                if (selectedPayment === 'member_card') {
                    await processMemberCardPayment();
                } else {
                    // 其他支付方式
                    await simulatePayment();
                }
                
                // 根据支付类型调用不同API
                if (isDeliveryOnly) {
                    // 配送费支付：调用配送费支付API
                    try {
                        const orderId = order.orderId || order.orderNo || order.id;
                        const deliveryPayResponse = await fetch(`http://localhost:3000/api/cleaning/orders/${orderId}/pay-delivery-fee`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
                            },
                            body: JSON.stringify({
                                provider: deliveryProvider,
                                fee: deliveryOnlyFee,
                                mode: deliveryModeType,
                                method: selectedPayment,
                                transactionId: 'TXN' + Date.now(),
                                payTime: new Date().toISOString()
                            })
                        });
                        const deliveryPayResult = await deliveryPayResponse.json();
                        if (deliveryPayResult.success) {
                            console.log('[配送费支付] 后端支付状态更新成功');
                        } else {
                            console.warn('[配送费支付] 后端返回失败:', deliveryPayResult.error);
                        }
                    } catch (apiError) {
                        console.warn('[配送费支付] 后端API调用失败（本地模式继续）:', apiError.message);
                    }
                } else {
                    // 正常订单支付：调用订单支付API
                    try {
                        const payResponse = await fetch(`http://localhost:3000/api/cleaning/orders/${order.orderId}/pay`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
                            },
                            body: JSON.stringify({
                                method: selectedPayment,
                                transactionId: 'TXN' + Date.now()
                            })
                        });
                        const payResult = await payResponse.json();
                        if (payResult.success) {
                            console.log('后端支付状态更新成功');
                        }
                    } catch (apiError) {
                        console.warn('后端支付状态更新失败:', apiError);
                    }
                }
                
                // 完成支付

            } catch (error) {

                payBtn.classList.remove('paying');
                payBtn.querySelector('span').textContent = originalText;

        // 完成支付（通用）
        async function completePayment() {
            // 支付成功
            order.status = order.status || 'paid';
            order.payTime = new Date().toLocaleString();
            order.paymentMethod = selectedPayment;
            
            // ===== 配送费单独支付模式 =====
            if (isDeliveryOnly) {
                // 标记配送费已支付
                order.deliveryFeePaid = true;
                order.deliveryFeePaidAt = new Date().toISOString();
                order.deliveryFee = deliveryOnlyFee;
                order.selectedProvider = deliveryProvider;
                order.deliveryMode = deliveryModeType;
                order.deliveryMethod = 'courier';
                // 初始状态：商家待出库（等待门店准备物品交给骑手）
                order.deliveryStatus = 'awaiting_store_outbound';
                order.courier = order.courier || {};
                order.courier.status = 'awaiting_store_outbound';
                order.courier.progress = 0;
                order.courier.provider = deliveryProvider;
                order.courier.paidAt = order.deliveryFeePaidAt;
                
                // 更新localStorage中的订单数据
                updateOrderInLocalStorage(order);
                
                // 通知门店：配送费已支付 + 触发灯条管理窗口
                // 跑腿配送到家模式下，店员需要灯条来快速定位物品交给骑手
                // 注意：isDeliveryOnly 只会在第二程（门店→到家）时进入，第一程支付不会触发
                try {
                    const storeId = order.store?.storeId || order.storeId || 'ST001';
                    const orderId = order.orderId || order.orderNo || order.id;
                    
                    // === 1. 写入 store_light_request（触发M端灯条管理窗口） ===
                    const items = (order.items || order.services || []).map((item, idx) => ({
                        itemId: `${orderId}-${idx}`,
                        itemName: item.name || item.serviceName || ('物品' + (idx + 1)),
                        lampIndex: idx,
                        orderId: orderId,
                        customerName: order.contact?.name || '客户',
                        storeId: storeId,
                        timestamp: Date.now(),
                        status: 'active'
                    }));
                    
                    const lightRequest = {
                        type: 'delivery_return_request',
                        orderId: orderId,
                        storeId: storeId,
                        storeName: order.store?.name || '门店',
                        timestamp: Date.now(),
                        customerName: order.contact?.name || '客户',
                        status: 'active',
                        deliveryProvider: deliveryProvider,
                        deliveryFee: deliveryOnlyFee,
                        deliveryMode: deliveryModeType,
                        message: '跑腿配送到家：请根据灯条取出物品交给骑手',
                        items: items.length > 0 ? items : [{
                            itemId: orderId + '-0',
                            itemName: '配送物品',
                            lampIndex: 0,
                            orderId: orderId,
                            customerName: order.contact?.name || '客户',
                            storeId: storeId,
                            timestamp: Date.now(),
                            status: 'active'
                        }]
                    };
                    localStorage.setItem('store_light_request', JSON.stringify(lightRequest));
                    
                    // 触发跨标签页通知
                    window.dispatchEvent(new StorageEvent('storage', {
                        key: 'store_light_request',
                        newValue: JSON.stringify(lightRequest)
                    }));
                    
                    // === 2. 写入 delivery_fee_paid_ 标记（兜底记录） ===
                    const payload = {
                        type: 'delivery_fee_paid',
                        action: 'light_on',
                        lightColor: 'blue',
                        orderId: orderId,
                        storeId: storeId,
                        storeName: order.store?.name || '门店',
                        provider: deliveryProvider,
                        fee: deliveryOnlyFee,
                        mode: deliveryModeType,
                        customerName: order.contact?.name || '客户',
                        deliveryStatus: 'awaiting_store_outbound',
                        message: '配送费已支付，请准备物品出库',
                        timestamp: new Date().toISOString()
                    };
                    localStorage.setItem('delivery_fee_paid_' + orderId, JSON.stringify(payload));
                    
                    // === 3. 写入 courier_order_paid_* 通知M端（点亮物理灯条+Toast） ===
                    localStorage.setItem('courier_order_paid_' + orderId, JSON.stringify({
                        type: 'courier_order_paid',
                        orderId: orderId,
                        storeId: storeId,
                        storeName: order.store?.name || '门店',
                        customerName: order.contact?.name || '客户',
                        customerPhone: order.contact?.phone || '',
                        itemCount: (order.items || order.services || []).length,
                        deliveryProvider: deliveryProvider,
                        deliveryFee: deliveryOnlyFee,
                        timestamp: new Date().toISOString()
                    }));
                    localStorage.setItem('last_courier_order_paid', orderId);
                    
                    console.log('[配送费支付] 灯条管理窗口已触发 + courier_order_paid 通知, 订单:', orderId);
                } catch (e) {
                    console.warn('[配送费支付] 通知门店失败:', e);
                }
                
                // 小延迟后跳转
                setTimeout(() => {
                    window.location.href = `c-order-detail.html?id=${order.orderId || order.orderNo}`;
                }, 500);
                return;
            }
            
            // ===== 正常订单支付模式 =====
            // 更新C端订单
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const orderIndex = orders.findIndex(o => o.orderId === order.orderId);
            if (orderIndex > -1) {
                orders[orderIndex] = order;
            }
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.setItem('currentOrder', JSON.stringify(order));
            
            // 同时同步到门店端订单（确保门店能看到新订单）
            let storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
            const storeOrderIndex = storeOrders.findIndex(o => o.orderId === order.orderId);
            if (storeOrderIndex > -1) {
                // 更新已有订单
                storeOrders[storeOrderIndex] = order;
            } else {
                // 添加新订单到门店列表
                storeOrders.unshift(order);
            }
            localStorage.setItem('store_orders', JSON.stringify(storeOrders));
            
            // 同步到admin端
            let allOrders = JSON.parse(localStorage.getItem('all_orders') || '[]');
            const adminOrderIndex = allOrders.findIndex(o => o.orderId === order.orderId);
            if (adminOrderIndex > -1) {
                allOrders[adminOrderIndex] = order;
            } else {
                allOrders.unshift(order);
            }
            localStorage.setItem('all_orders', JSON.stringify(allOrders));
            
            // 同步到admin
            localStorage.setItem('all_orders', JSON.stringify([...storeOrders, ...orders.filter(o => !storeOrders.find(so => so.orderId === o.orderId))]));
            
            // ================================================
            // 跑腿配送订单：支付完成后触发灯条点亮和打印
            // ================================================
            if (order.deliveryMethod === 'courier' || order.pickupMethod === 'home_delivery') {
                triggerCourierOrderReady(order);
            }
            
            // 跳转到成功页面
            window.location.href = 'c-order-success.html';
        }
        
        // 更新订单到localStorage（配送费支付后）
        function updateOrderInLocalStorage(updatedOrder) {
            try {
                // 更新orders列表
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                const orderId = updatedOrder.orderId || updatedOrder.orderNo || updatedOrder.id;
                const idx = orders.findIndex(o => 
                    o.orderId === orderId || o.id === orderId || o.orderNo === orderId
                );
                if (idx > -1) {
                    orders[idx] = { ...orders[idx], ...updatedOrder };
                    localStorage.setItem('orders', JSON.stringify(orders));
                }
                
                // 更新currentOrder
                localStorage.setItem('currentOrder', JSON.stringify(updatedOrder));
                
                // 同步更新store_orders
                const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
                const storeIdx = storeOrders.findIndex(o => 
                    o.orderId === orderId || o.id === orderId || o.orderNo === orderId
                );
                if (storeIdx > -1) {
                    storeOrders[storeIdx] = { ...storeOrders[storeIdx], ...updatedOrder };
                    localStorage.setItem('store_orders', JSON.stringify(storeOrders));
                }
            } catch (e) {
                console.warn('[配送费支付] 更新localStorage失败:', e);
            }
        }

        // 模拟支付
        function simulatePayment() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // 100%成功率（测试模式）
                    resolve({ success: true });
                }, 1500);
            });
        }

        // 取消订单
        function cancelOrder() {
            if (confirm('确定要取消该订单吗？')) {
                clearInterval(countdownTimer);
                
                // 从订单列表中移除
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                const filteredOrders = orders.filter(o => o.orderId !== order.orderId);
                localStorage.setItem('orders', JSON.stringify(filteredOrders));
                localStorage.removeItem('currentOrder');
                
                window.location.href = 'c-index.html';
            }
        }
        
        // ================================================
        // 跑腿配送订单支付完成后的处理
        // 触发门店灯条点亮和打印配送订单
        // ================================================
        async function triggerCourierOrderReady(order) {
            console.log('[C端] 跑腿配送订单支付完成，触发门店通知');
            
            try {
                // 1. 获取门店信息
                const storeId = order.store?.storeId || order.storeId;
                const storeName = order.store?.name || '门店';
                
                // 2. 发送MQTT通知点亮门店灯条
                // 通知格式：{ type: 'courier_order_paid', orderId, storeId, customerName, items }
                const mqttPayload = {
                    type: 'courier_order_paid',
                    orderId: order.orderId,
                    storeId: storeId,
                    storeName: storeName,
                    customerName: order.contact?.name || '客户',
                    customerPhone: order.contact?.phone || '',
                    itemCount: (order.items || order.services || []).length,
                    deliveryProvider: order.deliveryProvider || 'unknown',
                    deliveryFee: order.deliveryFee || 0,
                    timestamp: new Date().toISOString()
                };
                
                // 通过localStorage事件通知M端（跨页面通信）
                localStorage.setItem('courier_order_paid_' + order.orderId, JSON.stringify(mqttPayload));
                localStorage.setItem('last_courier_order_paid', order.orderId);
                
                // 触发自定义事件通知M端页面
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'courier_order_paid_' + order.orderId,
                    newValue: JSON.stringify(mqttPayload)
                }));
                
                console.log('[C端] 已发送跑腿订单支付通知:', mqttPayload);
                
                // 3. 同时调用后端API通知门店
                try {
                    await fetch('http://localhost:3000/api/store/courier-order-paid', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            orderId: order.orderId,
                            storeId: storeId,
                            storeName: storeName,
                            customerName: order.contact?.name,
                            customerPhone: order.contact?.phone,
                            itemCount: (order.items || order.services || []).length,
                            deliveryProvider: order.deliveryProvider,
                            deliveryFee: order.deliveryFee
                        })
                    });
                    console.log('[C端] 后端API通知成功');
                } catch (apiError) {
                    console.warn('[C端] 后端API通知失败:', apiError);
                }
                
                // 4. 保存配送费支付状态
                const storeOrders = JSON.parse(localStorage.getItem('store_orders') || '[]');
                const orderIndex = storeOrders.findIndex(o => o.orderId === order.orderId);
                if (orderIndex > -1) {
                    storeOrders[orderIndex].deliveryFeePaid = true;
                    storeOrders[orderIndex].deliveryFeePaidAt = new Date().toISOString();
                    localStorage.setItem('store_orders', JSON.stringify(storeOrders));
                }
                
                // 5. 【修复】不再写入 store_light_request — 灯条管理窗口只应在取件时触发
                // courier_order_paid_* 已在上方写入，M端 handleCourierOrderPaid 会点亮物理灯条
                console.log('[C端] 跑腿订单支付通知已发送 (courier_order_paid), 订单:', order.orderId);
                
            } catch (error) {
                console.error('[C端] 触发跑腿订单准备失败:', error);
            }
        }
    </script>
